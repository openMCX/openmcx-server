#!KAMAILIO
#
# OpenMCX Licence Information : AGPL-3.0-or-later
#

# The P-CSCF of IMS AKA (TS 33.203 clauses 6 and 7, TS 24.229 clauses 5.2.2.1 and 5.2.2.2, RFC 3329): in front of the
# SIP core (docker/kamailio.cfg, the S-CSCF of the IMS AKA identities). A UE sends its initial REGISTER unprotected
# to port 5060 (UDP or TCP); the 401 (Unauthorized) of the SIP core sets up the two pairs of IPsec ESP security
# associations (transport mode) with the UE, and every further request and response of that UE runs over them, SIP
# over TCP or UDP (TS 24.229 clause 4.2A, RFC 3261 clause 18): over TCP the UE connects from its protected client port
# to the protected server port here, and this P-CSCF connects from its protected client port to the UE's protected
# server port; over UDP the UE sends from its protected client port (TS 33.203 clause 7.1), and requests of 1300 bytes
# or more, and the requests of a dialog this P-CSCF Record-Routed over TCP, go over TCP. Generated per lab by
# tools/provision.py (@...@ placeholders); needs CAP_NET_ADMIN and the host's xfrm_user, esp4, authenc, hmac(sha1)
# and cbc(aes) kernel modules. The SIP core is reached over TLS with this P-CSCF's certificate (CN pcscf), or over
# TCP in the explicit debug mode (-A SIP_DEBUG_NO_TLS).
#
# Specifications: TS 24.229 V19.7.0, TS 33.203 V19.1.0 (Rel-19); RFC 3261, RFC 3327, RFC 3329, RFC 3581, RFC 3310.

# The address the security associations are bound to: the container's (PCSCF_IP, set by its entrypoint).
#!trydefenvs PCSCF_IP
#!ifndef PCSCF_IP
#!define PCSCF_IP "127.0.0.1"
#!endif
# The protected ports: client ports from 5100, server ports from 6100, one of each per simultaneous UE.
#!define IPSEC_CLIENT_PORT 5100
#!define IPSEC_SERVER_PORT 6100
#!define IPSEC_ALGORITHMS "null/aes-gcm-us,null/aes-gcm,hmac-sha2-256-128/aes-cbc,hmac-sha-1-96/aes-cbc,aes-gmac-us/null,aes-gmac/null,hmac-sha2-256-128/null,hmac-sha-1-96/null"
#!define IPSEC_ALGORITHMS_MATCH ",null/aes-gcm-us,null/aes-gcm,hmac-sha2-256-128/aes-cbc,hmac-sha-1-96/aes-cbc,aes-gmac-us/null,aes-gmac/null,hmac-sha2-256-128/null,hmac-sha-1-96/null,"
#!ifndef IPSEC_MAX_CONN
#!define IPSEC_MAX_CONN @IPSEC_MAX_CONN@
#!endif
# ipsec_forward(): force the protected send socket (1) and a full destination URI with its transport (128); for a
# registration flow (RFC 5626) also over the UE's own connection, from its protected client port (64).
#!define IPSEC_FORWARD_FLAGS 129
#!define IPSEC_FORWARD_FLOW_FLAGS 193

debug=2
log_stderror=yes
children=4
tcp_children=4
auto_aliases=no
use_dns_cache=no
# TS 24.229 clause 5.2.2.2 item 1A b): a TCP connection towards the UE starts from the protected client port.
tcp_reuse_port=yes
tcp_connection_lifetime=3605
#!ifdef SIP_DEBUG_NO_TLS
enable_tls=no
#!else
enable_tls=yes
tls_threads_mode=2
#!endif
# The unprotected port of the initial REGISTER (TS 33.203 clause 7.1, TS 24.229 clause 5.2.2.2 item 2).
listen=udp:0.0.0.0:5060 advertise pcscf:5060
listen=tcp:0.0.0.0:5060 advertise pcscf:5060
# The SIP core side: requests to the P-CSCF's users arrive here by its Path.
#!ifdef SIP_DEBUG_NO_TLS
#!define CORE_PORT 5062
#!define CORE_URI "sip:sip-core:5060;transport=tcp"
#!define PATH_URI "sip:term@pcscf:5062;transport=tcp;lr"
listen=tcp:0.0.0.0:5062 advertise pcscf:5062
#!else
#!define CORE_PORT 5061
#!define CORE_URI "sip:sip-core:5061;transport=tls"
#!define PATH_URI "sip:term@pcscf:5061;transport=tls;lr"
listen=tls:0.0.0.0:5061 advertise pcscf:5061
#!endif
alias="pcscf"

#!ifndef SIP_DEBUG_NO_TLS
loadmodule "tls.so"
#!endif
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "ipops.so"
loadmodule "htable.so"
loadmodule "ims_usrloc_pcscf.so"
loadmodule "ims_ipsec_pcscf.so"
loadmodule "ims_registrar_pcscf.so"

#!ifndef SIP_DEBUG_NO_TLS
modparam("tls", "config", "/config/pcscf-tls.cfg")
#!endif
modparam("rr", "enable_full_lr", 1)
# Record-Route with the sip scheme also for a SIPS Request-URI: the UE reaches this P-CSCF over IPsec, not TLS, and
# IMS uses no SIPS (TS 24.229); a sips Record-Route would make the UE look for TLS to its first hop.
modparam("rr", "ignore_sips", 1)
modparam("ims_usrloc_pcscf", "db_mode", 0)
modparam("ims_usrloc_pcscf", "match_contact_host_port", 1)
# TS 24.229 clause 5.2.2.2 (200 items 1, 2) and TS 33.203 clause 7.4: a contact, and with it its security
# associations, ends 30 s after its registration expires (the default grace is an hour), checked every 10 s.
modparam("ims_usrloc_pcscf", "expires_grace", 30)
modparam("ims_usrloc_pcscf", "timer_interval", 10)
# No reg event subscription: the SIP core does not serve the reg event package.
modparam("ims_registrar_pcscf", "subscribe_to_reginfo", 0)
modparam("ims_registrar_pcscf", "publish_reginfo", 0)
modparam("ims_registrar_pcscf", "is_registered_fallback2ip", 1)
# The temporary security associations live for reg-await-auth, 240 s (TS 24.229 clause 5.2.2.2, 401 item 4): the
# pending contact's 210 s and the 30 s grace.
modparam("ims_registrar_pcscf", "pending_reg_expires", 210)
# A deregistered contact, and its security associations, go 5 s after the 200 (OK), which they still protect
# (TS 24.229 clause 5.2.2.2, 200 item 3).
modparam("ims_registrar_pcscf", "delete_delay", 5)
modparam("ims_ipsec_pcscf", "ipsec_listen_addr", PCSCF_IP)
modparam("ims_ipsec_pcscf", "ipsec_client_port", IPSEC_CLIENT_PORT)
modparam("ims_ipsec_pcscf", "ipsec_server_port", IPSEC_SERVER_PORT)
modparam("ims_ipsec_pcscf", "ipsec_max_connections", IPSEC_MAX_CONN)
modparam("ims_ipsec_pcscf", "ipsec_spi_id_start", 4096)
modparam("ims_ipsec_pcscf", "ipsec_spi_id_range", 1000)
# TS 33.203 V19.1.0 clause 7.2 and annex H, TS 33.210 V19.3.0 clauses 5.3.3/5.3.4: the P-CSCF's algorithm
# combinations by priority (AES-GCM and AES-GMAC with unique salt first, annex I); it selects the first the UE offers
# and lists them all in the Security-Server. HMAC-SHA-1-96 with AES-CBC stays (TS 37.579-1 table 5.5.2.19.7-1).
modparam("ims_ipsec_pcscf", "ipsec_algorithms", IPSEC_ALGORITHMS)
# TS 24.229 V19.7.0 clause 5.2.2.2, 401 item 4, and TS 33.203 V19.1.0 clause 7.4.2a: a temporary set (also a
# re-registration's, which no pending contact holds) ends after reg-await-auth, 4 minutes (TS 24.229 table 7.7.1),
# unless its registration completes.
modparam("ims_ipsec_pcscf", "ipsec_temp_set_lifetime", 240)
# Per Call-ID of a challenged registration: the Security-Server sent, the Security-Client and the private user
# identity received (TS 24.229 clause 5.2.2.2 item 3 a) and c)), for reg-await-auth.
modparam("htable", "htable", "secagree=>size=8;autoexpire=240;")

request_route {
    if (!mf_process_maxfwd_header("16")) { sl_send_reply("483", "Too Many Hops"); exit; }
    $var(trans) = 0;
    # The SIP core, by certificate and address (by address in the explicit TCP debug mode), on whichever socket the
    # dialog's Record-Route names: the kernel may pick the TCP socket of 5060 for the connection to the core.
    $var(from_core) = 0;
#!ifdef SIP_DEBUG_NO_TLS
    dns_query("sip-core", "core");
    if ($proto == "tcp" && $si == $dns(core=>addr[0])) { $var(from_core) = 1; }
#!else
    if ($proto == "tls" && $tls_peer_verified == 1 && $tls_peer_subject_cn == "sip-core") { $var(from_core) = 1; }
#!endif
    if (is_method("CANCEL")) {
        if (t_check_trans()) { route(TO_UE_OR_CORE); t_relay(); }
        exit;
    }
    if (!is_method("ACK") && t_precheck_trans()) { t_check_trans(); exit; }
    t_check_trans();
    if ($var(from_core)) { route(FROM_CORE); exit; }
    if ($Rp == 5060) { route(UNPROTECTED); exit; }
    if (($Rp >= IPSEC_SERVER_PORT && $Rp < IPSEC_SERVER_PORT + IPSEC_MAX_CONN)
            || ($Rp >= IPSEC_CLIENT_PORT && $Rp < IPSEC_CLIENT_PORT + IPSEC_MAX_CONN)) {
        route(PROTECTED);
        exit;
    }
    sl_send_reply("403", "Forbidden");
}

# A CANCEL follows its INVITE: towards the UE through the security associations, towards the core as it is.
route[TO_UE_OR_CORE] {
    if ($var(from_core)) { ipsec_forward("location", IPSEC_FORWARD_FLAGS); }
    return;
}

# TS 24.229 clause 5.2.2.2 item 2 and TS 33.203 clause 7.2: on the unprotected port only the initial REGISTER, with a
# Security-Client header field offering ipsec-3gpp (RFC 3329 clause 2.3.1; otherwise 421 (Extension Required));
# TS 33.203 annex P.3: no SIP digest through this P-CSCF.
route[UNPROTECTED] {
    if (!is_method("REGISTER")) { sl_send_reply("403", "Register first"); exit; }
    if (!is_present_hf("Security-Client") || !($hdr(Security-Client) =~ "ipsec-3gpp")) {
        append_to_reply("Require: sec-agree\r\n");
        sl_send_reply("421", "Extension Required");
        exit;
    }
    if (!is_present_hf("Contact")) { sl_send_reply("403", "No contact header"); exit; }
    route(SECURITY_CLIENT_CHECK);
    route(IMPI_SETS_CHECK);
    # Item 2 b) and c) (RFC 3581): the Via's rport set to the source port if present, and received with the source
    # address, also when it is the sent-by address (NOTE 1). The core adds received itself when the Via has rport
    # or another sent-by address; otherwise it is added here. The UE's is the only Via of its REGISTER.
    if ($hdr(Via) =~ ";[[:space:]]*rport") { force_rport(); }
    $var(via_host) = $(hdr(Via){s.select,1, }{s.select,0,;}{s.select,0,:});
    if ($hdrc(Via) == 1 && !($hdr(Via) =~ ";[[:space:]]*(rport|received)") && $var(via_host) == $si) {
        assign_hf_value("Via[1].received", "$si");
    }
    pcscf_save_pending("location");
    $sht(secagree=>$ci::client) = $hdr(Security-Client);
    $sht(secagree=>$ci::impi) = $aU;
    $sht(secagree=>$ci::server) = $null;
    route(INTEGRITY_PROTECTED_NO);
    route(REGISTER_RELAY);
}

# TS 33.203 V19.1.0 clause 7.1 and annex H, RFC 3329 clause 2.2: the Security-Client offers at least one ipsec-3gpp
# mechanism with an integrity and encryption algorithm combination of this P-CSCF's list (IPSEC_ALGORITHMS; ealg absent
# means null; the removed hmac-md5-96 and des-ede3-cbc are none of them), ESP in transport mode if given, and the SPIs
# (above the 1 to 255 reserved by RFC 4303) and protected ports of the UE; otherwise 400 (Bad Request), TS 24.229
# clause 5.2.2.2 item 3. Each comma-separated mechanism is checked on its own; the module selects the first
# combination of the list the UE offers (ims_ipsec_pcscf, dependencies/kamailio patch 0003).
route[SECURITY_CLIENT_CHECK] {
    $var(sc) = $(hdr(Security-Client){s.tolower}{re.subst,/[[:space:]]//g}{re.subst,/,/|/g});
    $var(sc_ok) = 0;
    $var(n) = $(var(sc){s.count,|}) + 1;
    $var(i) = 0;
    while ($var(i) < $var(n) && $var(sc_ok) == 0) {
        $var(m) = ";" + $(var(sc){s.select,$var(i),|}) + ";";
        $var(i) = $var(i) + 1;
        $var(ok) = 1;
        if (!($var(m) =~ "^;ipsec-3gpp;")) { $var(ok) = 0; }
        if ($var(m) =~ ";prot=" && !($var(m) =~ ";prot=esp;")) { $var(ok) = 0; }
        if ($var(m) =~ ";mod=" && !($var(m) =~ ";mod=trans;")) { $var(ok) = 0; }
        if (!($var(m) =~ ";alg=[^;]+;") || !($var(m) =~ ";spi-c=[0-9]+;") || !($var(m) =~ ";spi-s=[0-9]+;")
                || !($var(m) =~ ";port-c=[0-9]+;") || !($var(m) =~ ";port-s=[0-9]+;")) {
            $var(ok) = 0;
        }
        if ($var(ok) == 1) {
            $var(alg) = $(var(m){re.subst,/.*;alg=([^;]+);.*/\1/});
            $var(ealg) = "null";
            if ($var(m) =~ ";ealg=[^;]+;") { $var(ealg) = $(var(m){re.subst,/.*;ealg=([^;]+);.*/\1/}); }
            $var(pair) = "," + $var(alg) + "/" + $var(ealg) + ",";
            if (!(IPSEC_ALGORITHMS_MATCH =~ $var(pair))) { $var(ok) = 0; }
        }
        if ($var(ok) == 1) {
            $var(spi_c) = $(var(m){re.subst,/.*;spi-c=([0-9]+);.*/\1/}{s.int});
            $var(spi_s) = $(var(m){re.subst,/.*;spi-s=([0-9]+);.*/\1/}{s.int});
            $var(port_c) = $(var(m){re.subst,/.*;port-c=([0-9]+);.*/\1/}{s.int});
            $var(port_s) = $(var(m){re.subst,/.*;port-s=([0-9]+);.*/\1/}{s.int});
            if ($var(spi_c) >= 256 && $var(spi_s) >= 256 && $var(spi_c) != $var(spi_s) && $var(port_c) >= 1
                    && $var(port_c) <= 65535 && $var(port_s) >= 1 && $var(port_s) <= 65535) {
                $var(sc_ok) = 1;
            }
        }
    }
    if (!$var(sc_ok)) {
        xlog("L_WARN", "refusing REGISTER from $si: Security-Client $hdr(Security-Client)\n");
        route(REFUSE_SECURITY_CLIENT);
    }
    # TS 33.203 V19.1.0 clause 7.1 rule 3: the pair (UE address, protected client port) "has not yet been associated
    # with entries in the "SA_table"", else "the registration is aborted and a suitable error message is sent".
    if (!ipsec_sa_pair_free("location", "$(ct{tobody.uri})", "$si", "$var(port_c)")) {
        xlog("L_WARN", "refusing REGISTER from $si: protected client port $var(port_c) already in use\n");
        route(REFUSE_SECURITY_CLIENT);
    }
    return;
}

# TS 33.203 V19.1.0 clause 7.1 rule 3: "the P-CSCF shall check that, for any one IMPI, no more than six SAs per
# direction are stored at any one time. If these checks are unsuccessful the registration is aborted and a suitable
# error message is sent to the UE." For a REGISTER that starts an authentication (an initial one, or one over the
# established associations): its challenge deletes the registration SAs of the private user identity ($aU, the
# Authorization username, TS 24.229 clause 5.1.1.2.1) and creates one more set (two SAs per direction, clause 7.4.2a),
# so at most two of its sets, over all its contacts, may stay: the one in use, old ones waiting for their pending
# transactions, the temporary one the REGISTER came over (ims_ipsec_pcscf, dependencies/kamailio patch 0003). The
# count and the admission are one step, bound to this REGISTER's transaction (created here): its challenge's set
# consumes the admission, the transaction's end gives back an unused one, so that two REGISTERs of one IMPI cannot
# both pass. Refused like the pair check above.
route[IMPI_SETS_CHECK] {
    if ($aU == $null) { return; }
    if (!t_newtran()) { sl_reply_error(); exit; }
    $var(trans) = 1;
    if (!ipsec_impi_reserve("$aU")) {
        xlog("L_WARN", "refusing REGISTER from $si: $aU holds six SAs per direction\n");
        route(REFUSE_SECURITY_CLIENT);
    }
    return;
}

# TS 24.229 clause 5.2.2.2 item 1: "integrity-protected" set by this P-CSCF only.
route[INTEGRITY_PROTECTED_NO] {
    assign_hf_value2("Authorization[*].integrity-protected", "\"no\"");
    return;
}

route[INTEGRITY_PROTECTED_YES] {
    assign_hf_value2("Authorization[*].integrity-protected", "\"yes\"");
    return;
}

# TS 33.203 V19.1.0 clauses 7.2 and 7.3.2.1 and rule 3 of clause 7.1: the 400 (Bad Request) to a REGISTER. Unprotected
# to an unprotected one. To one received over a set, clauses 7.4.1a/7.4.2a: "If SM1 was protected, the old SAs shall
# be used to protect the failure messages", and clause 7.1, UDP case: "The P-CSCF sends requests and responses
# protected with ESP to a UE on the port port_pc": statefully, from that set's port_pc to the UE's port_us
# (ipsec_reply_over_sa(); a stateless reply would leave from port_ps, where no SA to port_us exists); over TCP on the
# connection the REGISTER came on (TS 24.229 clause 5.2.2.2 NOTE 3).
route[REFUSE_SECURITY_CLIENT] {
    if ($var(trans) != 1 && $Rp == 5060) { sl_send_reply("400", "Unacceptable Security-Client"); exit; }
    if ($var(trans) != 1 && !t_newtran()) { sl_reply_error(); exit; }
    ipsec_reply_over_sa();
    t_reply("400", "Unacceptable Security-Client");
    exit;
}

# TS 24.229 clause 5.2.2.1: the REGISTER towards the S-CSCF, without the security agreement (RFC 3329 clause 2.3.1:
# the Security-* header fields and the sec-agree option-tags are for this hop) and with this P-CSCF's Path
# (RFC 3327), which the SIP core's requests to the user follow.
route[REGISTER_RELAY] {
    remove_hf("Security-Client");
    remove_hf("Security-Verify");
    route(STRIP_SEC_AGREE);
    # TS 24.229 clause 5.2.2.2 item 1A, RFC 5626 clause 5.1: a registration with reg-id is a flow; the Path's "ob"
    # says so to the S-CSCF and comes back in the Route of requests to the UE.
    $var(path) = "Path: <" + PATH_URI + ">\r\n";
    if ($(hdr(Contact)[*]) =~ ";[[:space:]]*reg-id[[:space:]]*=" && $(hdr(Supported)[*]) =~ "outbound") {
        $var(path) = "Path: <" + PATH_URI + ";ob>\r\n";
    }
    append_hf("$var(path)");
    $du = CORE_URI;
    t_on_reply("REGISTER_REPLY");
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

route[STRIP_SEC_AGREE] {
    if (is_present_hf("Require") && $hdr(Require) =~ "sec-agree") {
        $var(require) = "";
        if (!($hdr(Require) =~ "^[[:space:]]*sec-agree[[:space:]]*$")) {
            $var(require) = $(hdr(Require){re.subst,/[, ]*sec-agree//gi}{re.subst,/^[, ]*//});
        }
        remove_hf("Require");
        if ($(var(require){s.len}) > 0) { append_hf("Require: $var(require)\r\n"); }
    }
    if (is_present_hf("Proxy-Require") && $hdr(Proxy-Require) =~ "sec-agree") {
        $var(require) = "";
        if (!($hdr(Proxy-Require) =~ "^[[:space:]]*sec-agree[[:space:]]*$")) {
            $var(require) = $(hdr(Proxy-Require){re.subst,/[, ]*sec-agree//gi}{re.subst,/^[, ]*//});
        }
        remove_hf("Proxy-Require");
        if ($(var(require){s.len}) > 0) { append_hf("Proxy-Require: $var(require)\r\n"); }
    }
    return;
}

# A request of a UE over its security associations.
route[PROTECTED] {
    # TS 33.203 clause 7.1: the sent-by address of the UE's Via is the address bound to the security associations.
    $var(via_host) = $(hdr(Via)[0]{s.select,1, }{s.select,0,;}{s.select,0,:});
    if ($var(via_host) != $si) { sl_send_reply("403", "Via does not match the security association"); exit; }
    if (is_method("REGISTER")) { route(PROTECTED_REGISTER); exit; }
    route(STRIP_SEC_AGREE);
    # TS 24.229 clause 5.2.6.3.1: only a registered UE originates; the P-CSCF asserts its identity: the From identity
    # when it is one of the registered public user identities, the default one otherwise. The UE's own assertion is
    # never trusted. Requests inside a dialog carry it too: the SIP core takes the identity of its P-CSCF's users from
    # it alone (docker/kamailio.cfg route[PCSCF_CLIENT]).
    if (!pcscf_is_registered("location")) { sl_send_reply("403", "Register first"); exit; }
    remove_hf("P-Asserted-Identity");
    remove_hf("P-Preferred-Identity");
    if (pcscf_assert_identity("location", "$(fu{tobody.uri})")) {
        append_hf("P-Asserted-Identity: <$(fu{tobody.uri})>\r\n");
    } else {
        append_hf("P-Asserted-Identity: <$pcscf_asserted_identity>\r\n");
    }
    if (has_totag()) {
        if (!loose_route()) { sl_send_reply("404", "Not here"); exit; }
        # Towards the core over the existing connection: loose_route() forces the socket of the double Record-Route
        # (0.0.0.0:5061), and with tcp_reuse_port a forced socket opens a new connection from that fixed port to the
        # core, which the kernel refuses while the existing one lives.
        $fs = $null;
        t_on_reply("TO_UE_REPLY");
        if (!t_relay()) { sl_reply_error(); }
        exit;
    }
    # TS 24.229 clause 5.2.6.3.2: the Service-Route of the registration.
    if (!pcscf_follows_service_routes("location")) { pcscf_force_service_routes("location"); }
#!ifdef CLIENT_SDP_CHECK
    route(CLIENT_SDP_ADDRESS);
    if (!$var(sdp_ok)) { sl_send_reply("488", "SDP address is not the sender's"); exit; }
#!endif
    if (is_method("INVITE|SUBSCRIBE")) { record_route(); }
    $du = CORE_URI;
    t_on_reply("TO_UE_REPLY");
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

# TS 24.229 clause 5.2.2.2 item 3 and TS 33.203 clause 7.2: a REGISTER received protected. On the temporary security
# associations of a challenge (the Call-ID of the challenged REGISTER): Security-Verify must repeat the Security-Server
# sent and Security-Client the one received, and the private user identity must be the challenged one; otherwise 4xx
# (potential man-in-the-middle). On the established ones: a re-registration, with a new Security-Client.
route[PROTECTED_REGISTER] {
    if (!is_present_hf("Security-Client")) { sl_send_reply("403", "Security-Client missing"); exit; }
    route(SECURITY_CLIENT_CHECK);
    # The temporary associations are the ones of the last challenge: received on the protected server port of its
    # Security-Server from the UE's new protected client port of the challenged REGISTER's Security-Client. The
    # P-CSCF's port_ps stays the same across sets (TS 33.203 V19.1.0 clause 7.4.0, dependencies/kamailio patch
    # 0003), the UE's port_uc changes, so the source port tells the temporary set from the one in use.
    $var(temporary) = 0;
    if ($sht(secagree=>$ci::server) != $null && $sht(secagree=>$ci::client) != $null) {
        $var(pending_port_s) = $(sht(secagree=>$ci::server){re.subst,/.*port-s=([0-9]+).*/\1/}{s.int});
        $var(pending_port_c) = $(sht(secagree=>$ci::client){re.subst,/.*port-c=([0-9]+).*/\1/}{s.int});
        if ($Rp == $var(pending_port_s) && $sp == $var(pending_port_c)) { $var(temporary) = 1; }
    }
    if ($var(temporary)) {
        if (!is_present_hf("Security-Verify")) { sl_send_reply("403", "Security-Verify missing"); exit; }
        if ($(hdr(Security-Verify){re.subst,/[[:space:]]//g}) != $(sht(secagree=>$ci::server){re.subst,/[[:space:]]//g})
                || $(hdr(Security-Client){re.subst,/[[:space:]]//g}) != $(sht(secagree=>$ci::client){re.subst,/[[:space:]]//g})) {
            xlog("L_WARN", "refusing REGISTER from $si: Security-Verify or Security-Client does not match\n");
            sl_send_reply("403", "Security agreement does not match");
            exit;
        }
        if ($aU != $sht(secagree=>$ci::impi)) { sl_send_reply("403", "Private user identity changed"); exit; }
        $sht(secagree=>$ci::server) = $null;
    } else {
        # A re-registration over the established associations starts a new security agreement; the set it came on
        # becomes the old set once the new one is in use (TS 33.203 V19.1.0 clause 7.4.2a, REGISTER_REPLY).
        route(IMPI_SETS_CHECK);
        $sht(secagree=>$ci::client) = $hdr(Security-Client);
        $sht(secagree=>$ci::impi) = $aU;
    }
    # Item 3 d): rport is ignored over the security associations.
    pcscf_save_pending("location");
    # TS 33.203 V19.1.0 clause 6.1.5: "yes" only over an SA of this authentication or of the latest successful one; a
    # set being deleted (the old set after a later authentication, or a failed one's) is neither.
    if (ipsec_set_released()) {
        route(INTEGRITY_PROTECTED_NO);
    } else {
        route(INTEGRITY_PROTECTED_YES);
    }
    route(REGISTER_RELAY);
}

# TS 24.229 clause 5.2.2.2, the 401 (Unauthorized) and 200 (OK) to a REGISTER.
onreply_route[REGISTER_REPLY] {
    if (t_check_status("401")) {
        # 401 items 1 to 4: the temporary security associations from the Security-Client and the S-CSCF's ck and
        # ik, and the Security-Server; the module first deletes the registration SAs of the private user identity
        # (its temporary sets; the one this REGISTER came over once its transaction has ended), TS 33.203 V19.1.0
        # clauses 7.3.1.4 and 7.4.2a (dependencies/kamailio patches 0002 and 0003).
        if ($(T_req($hdr(Security-Client))) == $null || ipsec_create("location") != 1) {
            xlog("L_ERR", "no security associations for the 401 to $(T_req($ct)): not forwarded\n");
            drop;
        }
        # Item 2: forwarded only once ck and ik are removed, from each challenge (AKAv2-SHA-256 and AKAv1-MD5, in
        # their order).
        $var(challenges) = "";
        $var(i) = 0;
        $var(n) = $hdrc(WWW-Authenticate);
        while ($var(i) < $var(n)) {
            $var(www) = $(hdr(WWW-Authenticate)[$var(i)]{re.subst,/,[[:space:]]*(ck|ik)[[:space:]]*=[[:space:]]*"[^"]*"//gi});
            $var(challenges) = $var(challenges) + "WWW-Authenticate: " + $var(www) + "\r\n";
            $var(i) = $var(i) + 1;
        }
        remove_hf("WWW-Authenticate");
        append_hf("$var(challenges)");
        msg_apply_changes();
        if ($hdr(WWW-Authenticate) =~ "(^|[,[:space:]])(ck|ik)[[:space:]]*=") { drop; }
        $sht(secagree=>$ci::server) = $hdr(Security-Server);
    } else if (t_check_status("200")) {
        # 200 item 3: the response over the security association the REGISTER came on. Items 1 and 2: the
        # registration's contact and public user identities (P-Associated-URI), and the new security associations'
        # lifetime; a deregistration removes them.
        ipsec_forward("location", IPSEC_FORWARD_FLAGS);
        # TS 33.203 V19.1.0 clause 7.4.2a: SM12 completes the registration over its set, which is no longer one of
        # the registration SAs a later challenge deletes, nor ends with the temporary lifetime. If SM1 came over an
        # old valid set, that set stays in use for outbound messages until the UE's first message over the new set,
        # then goes once its pending transactions are over ("The old SAs are then deleted as soon as all pending SIP
        # transactions have been completed, or have timed out"); any other old set is deleted; if SM1 was
        # unprotected, the old sets are removed (dependencies/kamailio patch 0003).
        ipsec_set_completed();
        pcscf_save("location");
        exit;
    }
    # Item 5: the 401 over the security association the REGISTER came on, unprotected to an unprotected one.
    if ($(T_req($Rp)) != 5060) { ipsec_forward("location", IPSEC_FORWARD_FLAGS); }
    # TS 33.203 V19.1.0 clauses 7.3.1.1 to 7.3.1.3: a failure (not a new challenge) of the protected REGISTER on the
    # temporary set: "after processing the failure message, the PCSCF shall delete the new SAs". Kamailio sends the
    # response after this route, over those SAs: ipsec_destroy_when_idle() deletes them once that REGISTER's
    # transaction has ended.
    if (status =~ "^[3-6]" && !t_check_status("401") && $sht(secagree=>$ci::client) != $null) {
        $var(new_port_c) = $(sht(secagree=>$ci::client){re.subst,/.*port-c=([0-9]+).*/\1/}{s.int});
        if ($(T_req($Rp)) != 5060 && $(T_req($sp)) == $var(new_port_c)) {
            ipsec_destroy_when_idle("location", "$(T_req($ct){tobody.uri})", "$(T_req($si))", "$(T_req($sp))");
            $sht(secagree=>$ci::server) = $null;
        }
    }
}

# Responses to a UE's requests: over the security association the request came on; over TCP on the connection the
# request was received on (TS 24.229 clause 5.2.2.2 NOTE 3), which is where the core sends them by itself.
onreply_route[TO_UE_REPLY] {
    if ($(T_req($pr)) != "tcp") { ipsec_forward("location", IPSEC_FORWARD_FLAGS); }
}


# A request from the SIP core: to a user of this P-CSCF by its Path (initial requests) or by the dialog's route set.
route[FROM_CORE] {
    $var(flow) = 0;
    if (is_present_hf("Route") && $(hdr(Route)[0]) =~ "sip:term@[^>]*;ob") { $var(flow) = 1; }
    loose_route();
    if (!has_totag() && is_method("INVITE|SUBSCRIBE")) { record_route(); }
    if ($var(flow)) {
        # A registration flow (RFC 5626 clauses 5.3 and 7, TS 24.229 clause 5.1.1.2.2 item 1 b)): over the TCP
        # connection the UE set up from its protected client port to the protected server port, never a new one.
        if (ipsec_forward("location", IPSEC_FORWARD_FLOW_FLAGS) != 1) { sl_send_reply("430", "Flow Failed"); exit; }
        set_forward_no_connect();
    } else if (ipsec_forward("location", IPSEC_FORWARD_FLAGS) != 1) {
        # TS 24.229 clause 5.2.2.2 item 1A b) and TS 33.203 clause 7.1: to the UE's protected server port, from this
        # P-CSCF's protected client port, through the security associations of the UE's registration.
        sl_send_reply("480", "User unavailable"); exit;
    }
#!ifdef CLIENT_SDP_CHECK
    t_on_reply("UE_SDP_REPLY");
#!endif
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

#!ifdef CLIENT_SDP_CHECK
# TS 24.229 clause 5.2.7.2 (the P-CSCF's examination of SDP), as in docker/kamailio.cfg for the clients that reach the
# core directly: every c= address a UE offers or answers must be the UE's own, the source of its signalling.
route[CLIENT_SDP_ADDRESS] {
    $var(sdp_ok) = 1;
    if (!has_body() || !($rb =~ "c=IN IP[46] ")) { return; }
    $var(body) = $rb;
    $var(i) = 0;
    $var(lines) = $(var(body){line.count});
    while ($var(i) < $var(lines) && $var(i) < 400) {
        $var(line) = $(var(body){line.at,$var(i)}{s.trim});
        $var(i) = $var(i) + 1;
        if ($var(line) =~ "^c=IN IP") {
            $var(addr) = $(var(line){s.select,2, });
            if (!is_ip("$var(addr)") || !compare_ips("$var(addr)", "$si")) {
                xlog("L_WARN", "refusing SDP from $si: c= address $var(addr) is not the sender's\n");
                $var(sdp_ok) = 0;
                return;
            }
        }
    }
    return;
}

onreply_route[UE_SDP_REPLY] {
    route(CLIENT_SDP_ADDRESS);
    if (!$var(sdp_ok)) { drop; }
}
#!endif

