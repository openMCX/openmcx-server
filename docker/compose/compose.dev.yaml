    volumes:
      - ../../build/openmcx-mcptt-server:/usr/local/bin/openmcx-mcptt-server:ro
  mcx-user-db:
    volumes:
      - ../../build/mcx-user-db:/usr/local/bin/mcx-user-db:ro
  client-a:
