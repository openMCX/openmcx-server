      - ../../../openmcx-client/linux/build/mcx-client:/usr/local/bin/mcx-client:ro
  client-b:
    volumes:
      - ../../../openmcx-client/linux/build/mcx-client:/usr/local/bin/mcx-client:ro
  http-proxy:
    volumes:
      - ../../build/mcx-http-proxy:/usr/local/bin/mcx-http-proxy:ro
