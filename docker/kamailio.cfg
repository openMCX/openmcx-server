#!KAMAILIO
debug=2
log_stderror=yes
# SIP worker processes per UDP and per TCP/TLS listener (-A SIP_WORKERS=<n> to change). Two were too few under load:
# a worker blocks while it resolves a c= host name for the SDP check, so INVITEs queued for seconds
#.
#!ifndef SIP_WORKERS
#!define SIP_WORKERS 8
#!endif
children=SIP_WORKERS
tcp_children=SIP_WORKERS
#!ifdef SIP_DEBUG_NO_TLS
enable_tls=no
#!else
enable_tls=yes
# Required by the TLS module for OpenSSL 3 fork safety.
tls_threads_mode=2
#!endif
auto_aliases=no
# Docker service addresses can change on container recreation.
use_dns_cache=no
# A registered RFC 5626 flow is the only way to reach its client, so the core does
# not close it on its own: the lifetime exceeds the longest registration (3600 s).
tcp_connection_lifetime=3605
#!ifdef SIP_DEBUG_NO_TLS
listen=tcp:0.0.0.0:5060 advertise sip-core:5060
#!else
listen=tls:0.0.0.0:5061 advertise sip-core:5061
#!endif
alias="@DOMAIN@"
#!ifndef SIP_DEBUG_NO_TLS
loadmodule "tls.so"
#!endif
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_mysql.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "xlog.so"
loadmodule "ipops.so"
loadmodule "dialog.so"
loadmodule "htable.so"
loadmodule "nathelper.so"
#!ifdef CORE_RPC
tcp_accept_no_cl=yes
#!endif
#!ifdef CORE_RPC
# JSON-RPC over HTTP(S) on the SIP listeners for the operator's services (MCX Admin slice
# F2 and the dashboard): event_route[xhttp:request] admits two methods for two callers.
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
modparam("jsonrpcs", "transport", 1)
#!endif
#!ifndef SIP_DEBUG_NO_TLS
modparam("tls", "config", "/config/tls.cfg")
#!endif
modparam("auth_db", "db_url", "mysql://mcx:@DB_PASSWORD@@sip-db/mcx")
# The subscriber table holds digest hashes (HA1, RFC 2617 3.2.2.2), not passwords:
# tools/provision.py and the Credential Service write ha1 and ha1b only.
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 1)
modparam("registrar", "max_expires", 3600)
# RFC 5626 flows (route[FLOW_REGISTER]): a binding keeps the address of the
# connection it was registered on, and lookup() routes to it.
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("rr", "enable_full_lr", 1)
# Retain the verified transport peer beyond TM's default transaction lifetime.
modparam("htable", "htable", "invite_peer=>size=12;autoexpire=3600;")

request_route {
    if (!mf_process_maxfwd_header("16")) { sl_send_reply("483", "Too Many Hops"); exit; }
    $var(from_as) = 0;
    $var(as_user) = "";
#!ifdef SIP_DEBUG_NO_TLS
    # Explicit isolated-lab debug mode: trust the AS source address, not a certificate.
    if ($proto != "tcp") { sl_send_reply("403", "TCP debug transport required"); exit; }
    $var(peer_identity) = $si;
#!else
    if ($proto != "tls" || $tls_peer_verified != 1) { sl_send_reply("403", "TLS required"); exit; }
    $var(peer_identity) = $tls_peer_subject_cn;
#!endif
    route(AS_CHECK);
    # Transaction IDs and Via sent-by fields are caller-controlled. TM matches
    # them without checking the TLS certificate or received source address.
    # Bind even challenged INVITEs so their unchallengeable negative ACKs work.
    $var(transaction_key) = $ci + "|" + $ft + "|" + $cs;
    $var(transaction_peer) = $var(peer_identity) + "|" + $si;
    if (is_method("INVITE")) {
        sht_lock("invite_peer=>$var(transaction_key)");
        if ($sht(invite_peer=>$var(transaction_key)) == $null) {
            $sht(invite_peer=>$var(transaction_key)) = $var(transaction_peer);
        }
        $var(original_peer) = $sht(invite_peer=>$var(transaction_key));
        sht_unlock("invite_peer=>$var(transaction_key)");
        if ($var(original_peer) != $var(transaction_peer)) {
            sl_send_reply("403", "Transaction peer mismatch"); exit;
        }
    }
    if (is_method("CANCEL|ACK")) {
        $var(original_peer) = $sht(invite_peer=>$var(transaction_key));
        if ($var(original_peer) != $null && $var(original_peer) != $var(transaction_peer)) {
            if (is_method("CANCEL")) { sl_send_reply("403", "Transaction peer mismatch"); }
            exit;
        }
    }
    if (is_method("CANCEL")) {
        if ($var(original_peer) != $null && t_check_trans()) { t_relay(); }
        exit;
    }
    if (is_method("ACK")) {
        if ($var(original_peer) != $null && t_check_trans()) { t_relay(); exit; }
        # loose_route attaches the dialog context before reading its identity.
        route(DIALOG_ROUTE);
        if ($var(dialog_routed)) {
            if (is_known_dlg() && ($var(from_as) ||
                ($fU == $dlg_var(caller_user) && $var(peer_identity) == $dlg_var(caller_identity)) ||
                ($fU == $dlg_var(callee_user) && $var(peer_identity) == $dlg_var(callee_identity)))) {
                route(RELAY);
            }
        }
        exit;
    }
    if (t_precheck_trans()) { t_check_trans(); exit; }
    t_check_trans();
    if (!$var(from_as)) {
        if (!auth_check("@DOMAIN@", "subscriber", "0")) { auth_challenge("@DOMAIN@", "0"); exit; }
        if ($fU != $au || $fd != "@DOMAIN@") { sl_send_reply("403", "Identity mismatch"); exit; }
        # The alias parameter is the core's own routing state (route[CLIENT_CONTACT]).
        # A client that sends one would choose where its in-dialog requests go.
        if (is_present_hf("Contact") && $(hdr(Contact)[*]) =~ ";[[:space:]]*alias[[:space:]]*=") {
            sl_send_reply("400", "Contact alias parameter not allowed"); exit;
        }
        if (is_method("REGISTER")) {
            if ($tU != $au || $td != "@DOMAIN@") { sl_send_reply("403", "Identity mismatch"); exit; }
            consume_credentials();
            route(FLOW_REGISTER);
            if (!save("location")) { sl_reply_error(); }
            exit;
        }
        route(CLIENT_CONTACT);
        remove_hf("P-Asserted-Identity");
        append_hf("P-Asserted-Identity: <sip:$au@@DOMAIN@>\r\n");
        consume_credentials();
#!ifdef CLIENT_SDP_CHECK
        route(CLIENT_SDP_ADDRESS);
        if (!$var(sdp_ok)) { sl_send_reply("488", "SDP address is not the sender's"); exit; }
#!endif
    } else {
        if (($fU != $var(as_user) || $fd != "@DOMAIN@")) { sl_send_reply("403", "AS identity mismatch"); exit; }
        remove_hf("P-Asserted-Identity");
        append_hf("P-Asserted-Identity: <sip:$var(as_user)@@DOMAIN@>\r\n");
    }
    if (has_totag()) {
        # Authentication and From binding above also cover every dialog request.
        route(DIALOG_ROUTE);
        if ($var(dialog_routed)) {
            if (is_known_dlg() && !$var(from_as)) {
                # Bind the authenticated peer before its unchallengeable ACK.
                # In an AS-originated leg, the client can initiate a re-INVITE.
                if ($fU == $dlg_var(caller_user)) {
                    $dlg_var(caller_identity) = $var(peer_identity);
                } else if ($fU == $dlg_var(callee_user)) {
                    $dlg_var(callee_identity) = $var(peer_identity);
                } else { sl_send_reply("403", "Dialog identity mismatch"); exit; }
            }
            route(RELAY);
        }
        sl_send_reply("404", "Dialog route not found"); exit;
    }
    if (is_method("INVITE|SUBSCRIBE")) { record_route(); }
    if (is_method("INVITE")) {
        dlg_manage();
        $dlg_var(caller_identity) = $var(peer_identity);
        $dlg_var(caller_user) = $fU;
        $dlg_var(callee_user) = $rU;
    }
    if (!$var(from_as) && $rU == "@SERVICE_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
        route(RELAY);
    }
    # The PSIs of the other MC service servers (MCData, MCVideo).
    if (!$var(from_as) && $rd == "@DOMAIN@") {
        route(SERVICE_AS);
        if ($var(service_as)) { route(RELAY); }
    }
    # TS 24.481 6.3.13.2.2: the MCData server, an MCS server, subscribes to group
    # documents at the PSI of the GMS's subscription proxy, which the MCPTT server provides.
    if ($var(from_as) && $var(as_user) == "@MCDATA_USER@" && is_method("SUBSCRIBE") &&
            $rU == "@SERVICE_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
        route(RELAY);
    }
    if ($var(from_as) && $rd == "@DOMAIN@") {
        if (!lookup("location")) { sl_send_reply("480", "User unavailable"); exit; }
#!ifdef CLIENT_SDP_CHECK
        t_on_reply("CLIENT_SDP_REPLY");
#!endif
        # A binding registered as a flow sets the destination to that flow's
        # connection. Never dial the client: if the flow is gone, fail now.
        if ($du != $null) { set_forward_no_connect(); }
        route(RELAY);
    }
    sl_send_reply("403", "Route forbidden");
}
route[RELAY] {
    # Focus Contacts use the public session URI, including inside a dialog.
    # Route that logical URI to the AS after loose_route consumes our own Route.
    if (!$var(from_as) && $rU == "@SERVICE_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
    }
    # MCVideo focus URIs are the MCVideo PSI with a session parameter, as for MCPTT.
    if (!$var(from_as) && $rU == "@MCVIDEO_USER@" && $rd == "@DOMAIN@") {
        route(SERVICE_AS);
    }
    if (!t_relay()) { sl_reply_error(); }
    exit;
}

route[DIALOG_ROUTE] {
    $var(dialog_routed) = 0;
    # A public focus URI is local to the proxy but is not a strict-router URI.
    if (($rU == "@SERVICE_USER@" || $rU == "@MCVIDEO_USER@") && $rd == "@DOMAIN@") {
        if (loose_route_mode("1")) { $var(dialog_routed) = 1; }
    } else {
        if (loose_route()) {
            $var(dialog_routed) = 1;
            # A remote target the core aliased to a client's flow (route[CLIENT_CONTACT]).
            # Only an application server addresses clients inside a dialog.
            if ($var(from_as) && $(ru{uri.param,alias}) != "") {
                if (!handle_ruri_alias()) { sl_send_reply("400", "Bad alias"); exit; }
                set_forward_no_connect();
#!ifdef CLIENT_SDP_CHECK
                t_on_reply("CLIENT_SDP_REPLY");
#!endif
            }
        }
    }
    return;
}

# RFC 5626 (SIP Outbound): a client that registers with +sip.instance or reg-id
# is reached over the connection it registered on (the flow), never by its
# Contact, which it need not be able to accept connections on. The binding
# stores the flow's source address as its received address. Listening clients,
# which register plain Contacts, keep being reached at their Contact.
route[FLOW_REGISTER] {
    if ($(hdr(Contact)[*]) =~ "[+]sip[.]instance|reg-id") { fix_nated_register(); }
    return;
}

# RFC 5626 5.4: a client's Contact with the ob parameter can be reached only over
# its flow. The core adds ;alias=<ip>~<port>~<proto> for the flow, so that an
# application server's in-dialog requests to that remote target return here with
# it, and route[DIALOG_ROUTE] sends them over the flow. Other Contacts are
# passed on as the client wrote them.
route[CLIENT_CONTACT] {
    if (is_present_hf("Contact") && $ct =~ "^[^<]*<[^>]*;ob[;?>]") { add_contact_alias(); }
    return;
}

#!ifdef CORE_RPC
# Operator RPC (-A CORE_RPC, the admin labs): MCX Admin reads the registrations (ul.dump)
# for its dashboard, and the Credential Service reloads TLS (tls.reload) after it writes
# a new revocation list. Callers are known by their certificates (by their resolved
# addresses in the explicit TCP debug mode); nothing else is dispatched.
event_route[xhttp:request] {
    $var(rpc_peer) = "";
#!ifdef SIP_DEBUG_NO_TLS
    if (dns_int_match_ip("mcxadmin", "$si")) { $var(rpc_peer) = "mcxadmin"; }
    else if (dns_int_match_ip("credentials", "$si")) { $var(rpc_peer) = "credentials"; }
#!else
    if ($proto == "tls" && $tls_peer_verified == 1) { $var(rpc_peer) = $tls_peer_subject_cn; }
#!endif
    if ($hu != "/RPC" || $rm != "POST") { xhttp_reply("404", "Not Found", "text/plain", "not found\n"); exit; }
    if ($var(rpc_peer) == "mcxadmin" && $rb =~ "\"method\"[[:space:]]*:[[:space:]]*\"ul[.]dump\"") { jsonrpc_dispatch(); exit; }
    if ($var(rpc_peer) == "credentials" && $rb =~ "\"method\"[[:space:]]*:[[:space:]]*\"tls[.]reload\"") { jsonrpc_dispatch(); exit; }
    xlog("L_WARN", "refusing RPC from $si ($var(rpc_peer))\n");
    xhttp_reply("403", "Forbidden", "text/plain", "forbidden\n");
    exit;
}
#!endif

# TS 24.229 5.2.7.2, the P-CSCF's examination of SDP (with -A CLIENT_SDP_CHECK, where
# a client's media and signalling share its address): media a client offers or
# answers must be at the client's own address, the source of what it sent. Every
# c= address of the body (an IP address, or a name that resolves to one) must be
# the sender's; otherwise $var(sdp_ok) is 0. The application servers then accept
# the address of a user their configuration names no device for
# (sip.core_checks_media_address).
route[CLIENT_SDP_ADDRESS] {
    $var(sdp_ok) = 1;
    if (!has_body() || !($rb =~ "c=IN IP[46] ")) { return; }
    # Line by line: the configuration's regular expressions match within one line.
    $var(body) = $rb;
    $var(i) = 0;
    $var(lines) = $(var(body){line.count});
    while ($var(i) < $var(lines) && $var(i) < 400) {
        $var(line) = $(var(body){line.at,$var(i)}{s.trim});
        $var(i) = $var(i) + 1;
        # A pattern, not {s.substr,0,7}: that warns "substr out of range" for every line shorter than 7 characters.
        if ($var(line) =~ "^c=IN IP") {
            $var(addr) = $(var(line){s.select,2, });
            if (is_ip("$var(addr)")) {
                if (!compare_ips("$var(addr)", "$si")) { $var(sdp_ok) = 0; }
            } else if (!dns_int_match_ip("$var(addr)", "$si")) {
                $var(sdp_ok) = 0;
            }
            if ($var(sdp_ok) == 0) {
                xlog("L_WARN", "refusing SDP from $si: c= address $var(addr) is not the sender's\n");
                return;
            }
        }
    }
    return;
}

# An MCPTT application server, identified by certificate and resolved address
# (by address alone in the explicit TCP debug mode). Generated per lab.
route[AS_CHECK] {
@AS_ROUTES@
}

# The server of an MC service other than MCPTT, by its PSI: sets $du and
# $var(service_as). Generated per lab.
route[SERVICE_AS] {
    $var(service_as) = 0;
@SERVICE_AS_ROUTES@
}

# The participating MCPTT server serving the requesting user. Generated per lab.
route[PARTICIPATING] {
@PARTICIPATING_ROUTES@
}

# Responses from clients: the same Contact handling as their requests
# (route[CLIENT_CONTACT]). A response cannot be refused, so one whose Contact
# carries an alias parameter is dropped: the application server's transaction
# then fails as if the client had not answered, and never learns that target.
reply_route {
    $var(from_as) = 0;
    route(AS_CHECK);
    if (!$var(from_as) && is_present_hf("Contact")) {
        if ($(hdr(Contact)[*]) =~ ";[[:space:]]*alias[[:space:]]*=") {
            xlog("L_WARN", "dropping $rs response from $si:$sp: Contact alias parameter\n");
            drop;
        }
        route(CLIENT_CONTACT);
    }
}

#!ifdef CLIENT_SDP_CHECK
# A client's answer to a request the core delivered to it from its registration
# (armed in the location lookup): a response cannot be refused, so one whose SDP
# names another host than the client's is dropped. Responses from application
# servers are not clients' and are not examined.
onreply_route[CLIENT_SDP_REPLY] {
    route(CLIENT_SDP_ADDRESS);
    if (!$var(sdp_ok)) { drop; }
}
#!endif
