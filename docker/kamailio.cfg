#!KAMAILIO
debug=2
log_stderror=yes
# SIP worker processes per UDP and per TCP/TLS listener (-A SIP_WORKERS=<n> to change). Two were too few under load:
# a worker blocks while it resolves a c= host name for the SDP check, so INVITEs queued for seconds
#.
#!ifndef SIP_WORKERS
#!define SIP_WORKERS 8
#!endif
children=SIP_WORKERS
tcp_children=SIP_WORKERS
#!ifdef SIP_DEBUG_NO_TLS
enable_tls=no
#!else
enable_tls=yes
# Required by the TLS module for OpenSSL 3 fork safety.
tls_threads_mode=2
#!endif
auto_aliases=no
# Docker service addresses can change on container recreation.
use_dns_cache=no
# A registered RFC 5626 flow is the only way to reach its client, so the core does
# not close it on its own: the lifetime exceeds the longest registration (3600 s).
tcp_connection_lifetime=3605
#!ifdef SIP_DEBUG_NO_TLS
listen=tcp:0.0.0.0:5060 advertise sip-core:5060
#!else
listen=tls:0.0.0.0:5061 advertise sip-core:5061
#!endif
alias="@DOMAIN@"
#!ifndef SIP_DEBUG_NO_TLS
loadmodule "tls.so"
# Troubleshooting only, off by default: TLS_KEYLOG (config/lab.json "sip_core": {"tls_keylog": true}, or -A
# TLS_KEYLOG) writes the TLS session secrets of every SIP hop to /tmp/kamailio-tls-keylog.txt, for Wireshark to decrypt
# a capture (docs/USAGE.md section 7). A switch of its own: no log level turns it on. The file decrypts all SIP,
# access tokens included: never in production.
#!ifdef TLS_KEYLOG
modparam("tls", "keylog_mode", 11)
modparam("tls", "keylog_file", "/tmp/kamailio-tls-keylog.txt")
#!endif
#!endif
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_mysql.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "xlog.so"
loadmodule "ipops.so"
loadmodule "dialog.so"
loadmodule "htable.so"
loadmodule "nathelper.so"
loadmodule "uac.so"
#!ifdef WITH_AKA
# IMS AKA (TS 33.203 clause 6.1, TS 24.229 clause 5.4.1.2), with -A WITH_AKA (tools/provision.py, when an identity is
# provisioned for it): the core is the S-CSCF of the identities in the ims_subscription table, which register through
# the P-CSCF (docker/pcscf.cfg); every other identity keeps SIP digest over TLS.
loadmodule "sqlops.so"
loadmodule "gcrypt.so"
loadmodule "ims_auth.so"
#!endif
#!ifdef CORE_RPC
tcp_accept_no_cl=yes
#!endif
#!ifdef CORE_RPC
# JSON-RPC over HTTP(S) on the SIP listeners for the operator's services (MCX Admin slice
# F2 and the dashboard): event_route[xhttp:request] admits two methods for two callers.
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
modparam("jsonrpcs", "transport", 1)
#!endif
#!ifndef SIP_DEBUG_NO_TLS
modparam("tls", "config", "/config/tls.cfg")
#!endif
modparam("auth_db", "db_url", "mysql://mcx:@DB_PASSWORD@@sip-db/mcx")
# The subscriber table holds digest hashes (HA1, RFC 2617 3.2.2.2), not passwords:
# tools/provision.py and the Credential Service write ha1 and ha1b only.
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "use_domain", 1)
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 1)
modparam("registrar", "max_expires", 3600)
# RFC 5626 flows (route[FLOW_REGISTER]): a binding keeps the address of the
# connection it was registered on, and lookup() routes to it.
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("rr", "enable_full_lr", 1)
# Retain the verified transport peer beyond TM's default transaction lifetime.
modparam("htable", "htable", "invite_peer=>size=12;autoexpire=3600;")
#!ifdef WITH_AKA
# The per-IMPI subscription (TS 29.228 clause 6.3.1 step 4: the authentication scheme stored for the IMPI).
modparam("sqlops", "sqlcon", "sipdb=>mysql://mcx:@DB_PASSWORD@@sip-db/mcx")
# The vector source (route[AKA_VECTOR_DATA] and the ims_auth calls of route[AKA_CHALLENGE], route[AKA_RESYNC] and
# route[AKA_AUTHENTICATE]): the vectors are made here from the IMPI's K, OPc and AMF (av_mode 1, no HSS).
modparam("ims_auth", "av_mode", 1)
# TS 33.203 clause 6.1.1: the 401 offers "AKAv2-SHA-256" (RFC 4169 with SHA-256) first, then "AKAv1-MD5" (RFC 3310,
# TS 37.579-1 table 5.5.2.19.7-1), for one vector, with qop "auth"; the response is checked with the algorithm the
# Authorization names (dependencies/kamailio: aka_v2_sha256).
modparam("ims_auth", "aka_v2_sha256", 1)
modparam("ims_auth", "registration_default_algorithm", "AKAv1-MD5")
modparam("ims_auth", "registration_qop", "auth")
# Timer reg-await-auth, 4 minutes (TS 24.229 table 7.7.1).
modparam("ims_auth", "auth_vector_timeout", 240)
modparam("ims_auth", "name", "sip:sip-core.@DOMAIN@")
modparam("htable", "htable", "aka_await=>size=8;autoexpire=240;")
# TS 24.229 clause 5.4.1.2.2 step 7 and 5.4.1.2.2F a): the P-CSCF's Path is stored with the binding (lookup() then
# routes to the P-CSCF) and returned in the 200 (OK).
modparam("registrar", "use_path", 1)
modparam("registrar", "path_mode", 1)
#!endif

request_route {
    if (!mf_process_maxfwd_header("16")) { sl_send_reply("483", "Too Many Hops"); exit; }
    $var(from_as) = 0;
    $var(as_user) = "";
    $var(flow_target) = 0;
    $var(from_pcscf) = 0;
    $var(client_user) = "";
#!ifdef SIP_DEBUG_NO_TLS
    # Explicit isolated-lab debug mode: trust the AS source address, not a certificate.
    if ($proto != "tcp") { sl_send_reply("403", "TCP debug transport required"); exit; }
    $var(peer_identity) = $si;
#!else
    if ($proto != "tls" || $tls_peer_verified != 1) { sl_send_reply("403", "TLS required"); exit; }
    $var(peer_identity) = $tls_peer_subject_cn;
#!endif
    route(AS_CHECK);
#!ifdef WITH_AKA
    route(PCSCF_CHECK);
#!endif
    # Transaction IDs and Via sent-by fields are caller-controlled. TM matches
    # them without checking the TLS certificate or received source address.
    # Bind even challenged INVITEs so their unchallengeable negative ACKs work.
    $var(transaction_key) = $ci + "|" + $ft + "|" + $cs;
    $var(transaction_peer) = $var(peer_identity) + "|" + $si;
    if (is_method("INVITE")) {
        sht_lock("invite_peer=>$var(transaction_key)");
        if ($sht(invite_peer=>$var(transaction_key)) == $null) {
            $sht(invite_peer=>$var(transaction_key)) = $var(transaction_peer);
        }
        $var(original_peer) = $sht(invite_peer=>$var(transaction_key));
        sht_unlock("invite_peer=>$var(transaction_key)");
        if ($var(original_peer) != $var(transaction_peer)) {
            sl_send_reply("403", "Transaction peer mismatch"); exit;
        }
    }
    if (is_method("CANCEL|ACK")) {
        $var(original_peer) = $sht(invite_peer=>$var(transaction_key));
        if ($var(original_peer) != $null && $var(original_peer) != $var(transaction_peer)) {
            if (is_method("CANCEL")) { sl_send_reply("403", "Transaction peer mismatch"); }
            exit;
        }
    }
    if (is_method("CANCEL")) {
        if ($var(original_peer) != $null && t_check_trans()) { t_relay(); }
        exit;
    }
    if (is_method("ACK")) {
        if ($var(original_peer) != $null && t_check_trans()) { t_relay(); exit; }
        # loose_route attaches the dialog context before reading its identity.
        route(DIALOG_ROUTE);
        if ($var(dialog_routed)) {
            if (is_known_dlg() && ($var(from_as) ||
                ($fU == $dlg_var(caller_user) && $var(peer_identity) == $dlg_var(caller_identity)) ||
                ($fU == $dlg_var(callee_user) && $var(peer_identity) == $dlg_var(callee_identity)))) {
                route(RELAY);
            }
        }
        exit;
    }
    if (t_precheck_trans()) { t_check_trans(); exit; }
    t_check_trans();
    if (!$var(from_as)) {
#!ifdef WITH_AKA
        if ($var(from_pcscf)) {
            route(PCSCF_CLIENT);
        } else {
        # TS 29.228 clause 6.3.1 step 4, TS 33.180 clause 6.2.1: an identity provisioned for IMS AKA does not
        # register with SIP digest.
        if (is_method("REGISTER")) { route(DIGEST_SCHEME_CHECK); }
#!endif
        if (!auth_check("@DOMAIN@", "subscriber", "0")) { auth_challenge("@DOMAIN@", "0"); exit; }
        if ($fU != $au || $fd != "@DOMAIN@") { sl_send_reply("403", "Identity mismatch"); exit; }
        $var(client_user) = $au;
        # The alias parameter is the core's own routing state (route[CLIENT_CONTACT]).
        # A client that sends one would choose where its in-dialog requests go.
        if (is_present_hf("Contact") && $(hdr(Contact)[*]) =~ ";[[:space:]]*alias[[:space:]]*=") {
            sl_send_reply("400", "Contact alias parameter not allowed"); exit;
        }
        if (is_method("REGISTER")) {
            if ($tU != $au || $td != "@DOMAIN@") { sl_send_reply("403", "Identity mismatch"); exit; }
            consume_credentials();
            route(FLOW_REGISTER);
            # RFC 5626 section 6: a registration with reg-id from a UAC that supports
            # outbound is answered with the outbound option-tag in Require.
            if ($(hdr(Contact)[*]) =~ "reg-id" && $(hdr(Supported)[*]) =~ "(^|[[:space:],])outbound([[:space:],]|$)") {
                append_to_reply("Require: outbound\r\n");
            }
            if (!save("location")) { sl_reply_error(); exit; }
            route(THIRD_PARTY_REGISTER);
            exit;
        }
        route(CLIENT_CONTACT);
        remove_hf("P-Asserted-Identity");
        append_hf("P-Asserted-Identity: <sip:$au@@DOMAIN@>\r\n");
        consume_credentials();
#!ifdef CLIENT_SDP_CHECK
        route(CLIENT_SDP_ADDRESS);
        if (!$var(sdp_ok)) { sl_send_reply("488", "SDP address is not the sender's"); exit; }
#!endif
#!ifdef WITH_AKA
        }
#!endif
    } else {
#!ifdef GMS_PSI
        # TS 24.481 clause 6.3.13.3.1: the MCPTT server also provides the subscription proxy function of the GMS, under
        # the GMS-URI of this system (other than the MCPTT PSI); its requests in those dialogs assert that PSI.
        if ($var(as_user) == "@SERVICE_USER@" && $fU == "@GMS_USER@" && $fd == "@DOMAIN@") { $var(as_user) = "@GMS_USER@"; }
#!endif
        if (($fU != $var(as_user) || $fd != "@DOMAIN@")) { sl_send_reply("403", "AS identity mismatch"); exit; }
        remove_hf("P-Asserted-Identity");
        append_hf("P-Asserted-Identity: <sip:$var(as_user)@@DOMAIN@>\r\n");
    }
    if (has_totag()) {
        # Authentication and From binding above also cover every dialog request.
        route(DIALOG_ROUTE);
        if ($var(dialog_routed)) {
            if (is_known_dlg() && !$var(from_as)) {
                # Bind the authenticated peer before its unchallengeable ACK.
                # In an AS-originated leg, the client can initiate a re-INVITE.
                if ($fU == $dlg_var(caller_user)) {
                    $dlg_var(caller_identity) = $var(peer_identity);
                } else if ($fU == $dlg_var(callee_user)) {
                    $dlg_var(callee_identity) = $var(peer_identity);
                } else { sl_send_reply("403", "Dialog identity mismatch"); exit; }
            }
            route(RELAY);
        }
        sl_send_reply("404", "Dialog route not found"); exit;
    }
    if (is_method("INVITE|SUBSCRIBE")) { record_route(); }
    if (is_method("INVITE")) {
        dlg_manage();
        $dlg_var(caller_identity) = $var(peer_identity);
        $dlg_var(caller_user) = $fU;
        $dlg_var(callee_user) = $rU;
    }
    if (!$var(from_as) && $rU == "@SERVICE_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
        route(RELAY);
    }
#!ifdef GMS_PSI
    # TS 24.481 clause 6.3.13.2.1 step b: the GMS-URI (the GMS subscription proxy PSI), served by the MCPTT server.
    if (!$var(from_as) && $rU == "@GMS_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
        route(RELAY);
    }
#!endif
    # The PSIs of the other MC service servers (MCData, MCVideo).
    if (!$var(from_as) && $rd == "@DOMAIN@") {
        route(SERVICE_AS);
        if ($var(service_as)) { route(RELAY); }
    }
    # TS 24.481 6.3.13.2.2: the MCData server, an MCS server, subscribes to group
    # documents at the PSI of the GMS's subscription proxy, which the MCPTT server provides.
    if ($var(from_as) && $var(as_user) == "@MCDATA_USER@" && is_method("SUBSCRIBE") &&
            $rU == "@SERVICE_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
        route(RELAY);
    }
#!ifdef GMS_PSI
    # The same at the GMS-URI of this system (TS 24.481 clause 6.3.13.2.2 step b), when it is not the MCPTT PSI.
    if ($var(from_as) && $var(as_user) == "@MCDATA_USER@" && is_method("SUBSCRIBE") &&
            $rU == "@GMS_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
        route(RELAY);
    }
#!endif
    if ($var(from_as) && $rd == "@DOMAIN@") {
        if (!lookup("location")) { sl_send_reply("480", "User unavailable"); exit; }
#!ifdef CLIENT_SDP_CHECK
        t_on_reply("CLIENT_SDP_REPLY");
#!endif
#!ifdef WITH_AKA
        # A user registered through the P-CSCF: its Path (TS 24.229 clause 5.4.1.2.2 step 7) leads to the P-CSCF,
        # which the core may connect to.
        if ($du != $null && $(du{uri.host}) == "pcscf") { route(RELAY); }
#!endif
        # A binding registered as a flow sets the destination to that flow's
        # connection. Never dial the client: if the flow is gone, fail now.
        if ($du != $null) { route(FLOW_TARGET); }
        route(RELAY);
    }
    sl_send_reply("403", "Route forbidden");
}
route[RELAY] {
    # Focus Contacts use the public session URI, including inside a dialog.
    # Route that logical URI to the AS after loose_route consumes our own Route.
    if (!$var(from_as) && $rU == "@SERVICE_USER@" && $rd == "@DOMAIN@") {
        route(PARTICIPATING);
    }
    # MCVideo focus URIs are the MCVideo PSI with a session parameter, as for MCPTT;
    # so are MCData session identities (TS 24.282 clause 6.3.7.1.23 step 5).
    if (!$var(from_as) && ($rU == "@MCVIDEO_USER@" || $rU == "@MCDATA_USER@") && $rd == "@DOMAIN@") {
        route(SERVICE_AS);
    }
    if (!t_relay()) {
        # RFC 5626 section 5.3.1: the flow no longer exists.
        if ($var(flow_target)) {
            xlog("L_NOTICE", "flow failed: 430 Flow Failed for $rm to $ru via $du\n");
            send_reply("430", "Flow Failed"); exit;
        }
        sl_reply_error();
    }
    exit;
}

# A request to a client over its flow (RFC 5626): never open a new connection.
# If the flow no longer exists, the answer is 430 (Flow Failed), RFC 5626
# section 5.3.1, whether the send fails at once (route[RELAY]) or in the
# transaction (failure_route[FLOW_FAILED]).
route[FLOW_TARGET] {
    set_forward_no_connect();
    $var(flow_target) = 1;
    t_on_failure("FLOW_FAILED");
    return;
}

failure_route[FLOW_FAILED] {
    if (t_check_status("477")) {
        xlog("L_NOTICE", "flow failed: 430 Flow Failed for $rm to $ru via $du\n");
        t_reply("430", "Flow Failed");
    }
}

route[DIALOG_ROUTE] {
    $var(dialog_routed) = 0;
    # A public focus URI is local to the proxy but is not a strict-router URI.
    if (($rU == "@SERVICE_USER@" || $rU == "@MCVIDEO_USER@" || $rU == "@MCDATA_USER@") && $rd == "@DOMAIN@") {
        if (loose_route_mode("1")) { $var(dialog_routed) = 1; }
    } else {
        if (loose_route()) {
            $var(dialog_routed) = 1;
            # A remote target the core aliased to a client's flow (route[CLIENT_CONTACT]).
            # Only an application server addresses clients inside a dialog.
            if ($var(from_as) && $(ru{uri.param,alias}) != "") {
                if (!handle_ruri_alias()) { sl_send_reply("400", "Bad alias"); exit; }
                route(FLOW_TARGET);
#!ifdef CLIENT_SDP_CHECK
                t_on_reply("CLIENT_SDP_REPLY");
#!endif
            }
        }
    }
    return;
}

# TS 24.229 clause 5.4.1.7 (as an S-CSCF does by its initial filter criteria): after a registration, a
# third-party REGISTER to the server of each MC service whose information the client's REGISTER carries, with that
# REGISTER as a message/sip body, so that the server authorises the user from it (TS 24.379, TS 24.281 and TS 24.282
# clause 7.3.2). A deregistration (expiry 0) goes to every MC service server. The client's Authorization header
# is not passed on: the body carries the request line, From, To, Call-ID, Contact and the body.
route[THIRD_PARTY_REGISTER] {
    # The expiry is the Expires header's, else the Contact's expires parameter, else the registrar's default (RFC 3261
    # section 10.2.1.1). A $var assigned an absent value would hold 0, a deregistration, so each is tested first.
    $var(tpr_expires) = "3600";
    if (is_present_hf("Expires")) { $var(tpr_expires) = $(hdr(Expires){s.trim}); }
    else if ($(ct{tobody.params}{param.value,expires}) != $null && $(ct{tobody.params}{param.value,expires}) != "") {
        $var(tpr_expires) = $(ct{tobody.params}{param.value,expires});
    }
    $var(tpr_mcptt) = 0;
    $var(tpr_mcvideo) = 0;
    $var(tpr_mcdata) = 0;
    if ($cT =~ "mcptt-info" || $rb =~ "application/vnd[.]3gpp[.]mcptt-info[+]xml") { $var(tpr_mcptt) = 1; }
    if ($cT =~ "mcvideo-info" || $rb =~ "application/vnd[.]3gpp[.]mcvideo-info[+]xml") { $var(tpr_mcvideo) = 1; }
    if ($cT =~ "mcdata-info" || $rb =~ "application/vnd[.]3gpp[.]mcdata-info[+]xml") { $var(tpr_mcdata) = 1; }
    # TS 24.229 clause 5.4.1.7: a de-registration reaches the servers only once the user has no contact left; the
    # removal of one of its contacts (Expires 0 for that Contact) while another stays registered ends nothing.
    if ($var(tpr_expires) == "0") {
        if (registered("location", "sip:$var(client_user)@@DOMAIN@")) { return; }
        $var(tpr_mcptt) = 1; $var(tpr_mcvideo) = 1; $var(tpr_mcdata) = 1;
    }
    if (!$var(tpr_mcptt) && !$var(tpr_mcvideo) && !$var(tpr_mcdata)) { return; }
    $var(tpr_body) = "REGISTER " + $ru + " SIP/2.0\r\nFrom: " + $hdr(From) + "\r\nTo: " + $hdr(To) + "\r\nCall-ID: " + $ci
        + "\r\nContact: " + $hdr(Contact) + "\r\nExpires: " + $var(tpr_expires);
    if ($rb != $null && $rb != "") { $var(tpr_body) = $var(tpr_body) + "\r\nContent-Type: " + $cT + "\r\n\r\n" + $rb; }
    else { $var(tpr_body) = $var(tpr_body) + "\r\n\r\n"; }
    $var(tpr_user) = "sip:" + $var(client_user) + "@@DOMAIN@";
    if ($var(tpr_mcptt)) {
        route(PARTICIPATING);
        $var(tpr_service) = "@SERVICE_USER@";
        route(THIRD_PARTY_SEND);
    }
    if ($var(tpr_mcvideo) && "@MCVIDEO_USER@" != "") {
        $ru = "sip:@MCVIDEO_USER@@@DOMAIN@";
        route(SERVICE_AS);
        if ($var(service_as)) { $var(tpr_service) = "@MCVIDEO_USER@"; route(THIRD_PARTY_SEND); }
    }
    if ($var(tpr_mcdata) && "@MCDATA_USER@" != "") {
        $ru = "sip:@MCDATA_USER@@@DOMAIN@";
        route(SERVICE_AS);
        if ($var(service_as)) { $var(tpr_service) = "@MCDATA_USER@"; route(THIRD_PARTY_SEND); }
    }
    return;
}

route[THIRD_PARTY_SEND] {
    $uac_req(method) = "REGISTER";
    $uac_req(ruri) = "sip:" + $var(tpr_service) + "@@DOMAIN@";
    $uac_req(furi) = "sip:sip-core@@DOMAIN@";
    $uac_req(turi) = $var(tpr_user);
    $uac_req(ouri) = $du;
    $uac_req(hdrs) = "Contact: <sip:sip-core@@DOMAIN@>\r\nExpires: " + $var(tpr_expires) + "\r\nContent-Type: message/sip\r\n";
    $uac_req(body) = $var(tpr_body);
    uac_req_send();
    return;
}

# RFC 5626 (SIP Outbound): a client that registers with +sip.instance or reg-id
# is reached over the connection it registered on (the flow), never by its
# Contact, which it need not be able to accept connections on. The binding
# stores the flow's source address as its received address. Listening clients,
# which register plain Contacts, keep being reached at their Contact.
route[FLOW_REGISTER] {
    if ($(hdr(Contact)[*]) =~ "[+]sip[.]instance|reg-id") { fix_nated_register(); }
    return;
}

# RFC 5626 5.4: a client's Contact with the ob parameter can be reached only over
# its flow. The core adds ;alias=<ip>~<port>~<proto> for the flow, so that an
# application server's in-dialog requests to that remote target return here with
# it, and route[DIALOG_ROUTE] sends them over the flow. Other Contacts are
# passed on as the client wrote them.
route[CLIENT_CONTACT] {
    if (is_present_hf("Contact") && $ct =~ "^[^<]*<[^>]*;ob[;?>]") { add_contact_alias(); }
    return;
}

#!ifdef CORE_RPC
# Operator RPC (-A CORE_RPC, the admin labs): MCX Admin reads the registrations (ul.dump)
# for its dashboard, and the Credential Service reloads TLS (tls.reload) after it writes
# a new revocation list. Callers are known by their certificates (by their resolved
# addresses in the explicit TCP debug mode); nothing else is dispatched.
event_route[xhttp:request] {
    $var(rpc_peer) = "";
#!ifdef SIP_DEBUG_NO_TLS
    if (dns_int_match_ip("mcxadmin", "$si")) { $var(rpc_peer) = "mcxadmin"; }
    else if (dns_int_match_ip("credentials", "$si")) { $var(rpc_peer) = "credentials"; }
#!else
    if ($proto == "tls" && $tls_peer_verified == 1) { $var(rpc_peer) = $tls_peer_subject_cn; }
#!endif
    if ($hu != "/RPC" || $rm != "POST") { xhttp_reply("404", "Not Found", "text/plain", "not found\n"); exit; }
    if ($var(rpc_peer) == "mcxadmin" && $rb =~ "\"method\"[[:space:]]*:[[:space:]]*\"ul[.]dump\"") { jsonrpc_dispatch(); exit; }
    if ($var(rpc_peer) == "credentials" && $rb =~ "\"method\"[[:space:]]*:[[:space:]]*\"tls[.]reload\"") { jsonrpc_dispatch(); exit; }
    xlog("L_WARN", "refusing RPC from $si ($var(rpc_peer))\n");
    xhttp_reply("403", "Forbidden", "text/plain", "forbidden\n");
    exit;
}
#!endif

# TS 24.229 5.2.7.2, the P-CSCF's examination of SDP (with -A CLIENT_SDP_CHECK, where
# a client's media and signalling share its address): media a client offers or
# answers must be at the client's own address, the source of what it sent. Every
# c= address of the body (an IP address, or a name that resolves to one) must be
# the sender's; otherwise $var(sdp_ok) is 0. The application servers then accept
# the address of a user their configuration names no device for
# (sip.core_checks_media_address).
route[CLIENT_SDP_ADDRESS] {
    $var(sdp_ok) = 1;
    if (!has_body() || !($rb =~ "c=IN IP[46] ")) { return; }
    # Line by line: the configuration's regular expressions match within one line.
    $var(body) = $rb;
    $var(i) = 0;
    $var(lines) = $(var(body){line.count});
    while ($var(i) < $var(lines) && $var(i) < 400) {
        $var(line) = $(var(body){line.at,$var(i)}{s.trim});
        $var(i) = $var(i) + 1;
        # A pattern, not {s.substr,0,7}: that warns "substr out of range" for every line shorter than 7 characters.
        if ($var(line) =~ "^c=IN IP") {
            $var(addr) = $(var(line){s.select,2, });
            if (is_ip("$var(addr)")) {
                if (!compare_ips("$var(addr)", "$si")) { $var(sdp_ok) = 0; }
            } else if (!dns_int_match_ip("$var(addr)", "$si")) {
                $var(sdp_ok) = 0;
            }
            if ($var(sdp_ok) == 0) {
                xlog("L_WARN", "refusing SDP from $si: c= address $var(addr) is not the sender's\n");
                return;
            }
        }
    }
    return;
}

# An MCPTT application server, identified by certificate and resolved address
# (by address alone in the explicit TCP debug mode). Generated per lab.
route[AS_CHECK] {
@AS_ROUTES@
}

# The server of an MC service other than MCPTT, by its PSI: sets $du and
# $var(service_as). Generated per lab.
route[SERVICE_AS] {
    $var(service_as) = 0;
@SERVICE_AS_ROUTES@
}

# The participating MCPTT server serving the requesting user. Generated per lab.
route[PARTICIPATING] {
@PARTICIPATING_ROUTES@
}

# Responses from clients: the same Contact handling as their requests
# (route[CLIENT_CONTACT]). A response cannot be refused, so one whose Contact
# carries an alias parameter is dropped: the application server's transaction
# then fails as if the client had not answered, and never learns that target.
reply_route {
    $var(from_as) = 0;
    $var(from_pcscf) = 0;
    route(AS_CHECK);
#!ifdef WITH_AKA
    # The P-CSCF relays its users' responses: their Contacts are reached through it, never over a flow alias.
    route(PCSCF_CHECK);
    if ($var(from_pcscf)) { return; }
#!endif
    if (!$var(from_as) && is_present_hf("Contact")) {
        if ($(hdr(Contact)[*]) =~ ";[[:space:]]*alias[[:space:]]*=") {
            xlog("L_WARN", "dropping $rs response from $si:$sp: Contact alias parameter\n");
            drop;
        }
        route(CLIENT_CONTACT);
    }
}

#!ifdef CLIENT_SDP_CHECK
# A client's answer to a request the core delivered to it from its registration
# (armed in the location lookup): a response cannot be refused, so one whose SDP
# names another host than the client's is dropped. Responses from application
# servers are not clients' and are not examined.
onreply_route[CLIENT_SDP_REPLY] {
#!ifdef WITH_AKA
    # The P-CSCF examines the SDP of its users itself (docker/pcscf.cfg).
    $var(from_pcscf) = 0;
    route(PCSCF_CHECK);
    if ($var(from_pcscf)) { return; }
#!endif
    route(CLIENT_SDP_ADDRESS);
    if (!$var(sdp_ok)) { drop; }
}
#!endif

#!ifdef WITH_AKA
# The P-CSCF of IMS AKA (docker/pcscf.cfg), identified by certificate and resolved address (by address alone in the
# explicit TCP debug mode), as an application server is.
route[PCSCF_CHECK] {
#!ifdef SIP_DEBUG_NO_TLS
    dns_query("pcscf", "pc");
    if ($si == $dns(pc=>addr[0])) { $var(from_pcscf) = 1; }
#!else
    if ($tls_peer_subject_cn == "pcscf") {
        dns_query("pcscf", "pc");
        if ($si == $dns(pc=>addr[0])) { $var(from_pcscf) = 1; }
    }
#!endif
    return;
}

# TS 29.228 clause 6.3.1 step 4, TS 33.180 clause 6.2.1: a REGISTER with SIP digest (over TLS, not through the P-CSCF)
# for an identity whose stored scheme is IMS AKA is refused.
route[DIGEST_SCHEME_CHECK] {
    $var(scheme_impu) = "sip:" + $tU + "@" + $td;
    # Without credentials $aU is $null, which a $var would hold as the number 0, and MySQL compares a VARCHAR with 0
    # as a number: every IMPI would match. Only a present username is used.
    $var(scheme_impi) = "";
    if ($aU != $null) { $var(scheme_impi) = $aU; }
    sql_xquery("sipdb", "SELECT auth_scheme FROM ims_subscription WHERE auth_scheme = 'aka' AND (impu = $(var(scheme_impu){sql.val.str}) OR impi = $(var(scheme_impi){sql.val.str})) LIMIT 1", "scheme");
    if ($xavp(scheme=>auth_scheme) == "aka") {
        xlog("L_NOTICE", "refusing digest REGISTER of the IMS AKA identity $var(scheme_impu) from $si\n");
        sl_send_reply("403", "IMS AKA identity");
        exit;
    }
    return;
}

# A request from the P-CSCF for one of its users. REGISTER: the S-CSCF's IMS AKA procedures. Any other request: the
# P-CSCF asserted the identity of the security association it arrived on (TS 24.229 clause 5.2.6.3.1, TS 33.203
# clause 7.1), and the core trusts that P-Asserted-Identity as an S-CSCF trusts its P-CSCF.
route[PCSCF_CLIENT] {
    if (is_method("REGISTER")) { route(AKA_REGISTER); exit; }
    if (!is_present_hf("P-Asserted-Identity")) { sl_send_reply("403", "No asserted identity"); exit; }
    $var(client_user) = $(ai{uri.user});
    if ($(ai{uri.host}) != "@DOMAIN@" || $fU != $var(client_user) || $fd != "@DOMAIN@") {
        sl_send_reply("403", "Identity mismatch"); exit;
    }
    if (is_present_hf("Contact") && $(hdr(Contact)[*]) =~ ";[[:space:]]*alias[[:space:]]*=") {
        sl_send_reply("400", "Contact alias parameter not allowed"); exit;
    }
    remove_hf("P-Asserted-Identity");
    append_hf("P-Asserted-Identity: <sip:$var(client_user)@@DOMAIN@>\r\n");
    # The core's own Service-Route entry (route[AKA_REGISTER]), which the P-CSCF puts on initial requests.
    if (!has_totag()) { remove_hf("Route"); }
    return;
}

# TS 24.229 clauses 5.4.1.2.1, 5.4.1.2.1A, 5.4.1.2.2, 5.4.1.2.2F and 5.4.1.2.3A: a REGISTER of an IMS AKA identity,
# relayed by the P-CSCF with "integrity-protected" set by it in the Authorization header field.
route[AKA_REGISTER] {
    # Step 1: the private user identity from the Authorization username, the public user identity from To.
    if ($aU == $null || $aU == "") { sl_send_reply("403", "No private user identity"); exit; }
    $var(impi) = $aU;
    sql_xquery("sipdb", "SELECT impu, auth_scheme FROM ims_subscription WHERE impi = $(var(impi){sql.val.str})", "sub");
    # TS 29.228 clause 6.3.1 step 4: through the P-CSCF only identities whose stored scheme is IMS AKA.
    if ($xavp(sub=>auth_scheme) != "aka") { sl_send_reply("403", "Not an IMS AKA identity"); exit; }
    # The public user identity must belong to the private user identity (TS 29.228 clause 6.3.1 step 1).
    $var(impu) = "sip:" + $tU + "@" + $td;
    if ($td != "@DOMAIN@" || $xavp(sub=>impu) != $var(impu)) { sl_send_reply("403", "Identity mismatch"); exit; }
    $var(protected) = 0;
    if ($hdr(Authorization) =~ "integrity-protected[[:space:]]*=[[:space:]]*\"?yes") { $var(protected) = 1; }
    # TS 24.229 clause 5.4.1.2.3A: AUTS, the SQN was out of range at the UE: resynchronise and challenge again (its
    # "response" is not taken into account, NOTE 4).
    if ($hdr(Authorization) =~ "auts[[:space:]]*=") {
        $sht(aka_await=>$var(impi)) = $null;
        route(AKA_RESYNC);
        route(AKA_CHALLENGE);
    }
    if (!$var(protected)) {
        # Clause 5.4.1.2.1, last paragraph, and TS 33.203 clause 6.1.2.2: an answer with the challenge's nonce and an
        # empty response says that the UE deemed the challenge invalid (MAC failure).
        if (!($hdr(Authorization) =~ "nonce[[:space:]]*=[[:space:]]*\"\"") && $hdr(Authorization) =~ "response[[:space:]]*=[[:space:]]*\"\"") {
            $sht(aka_await=>$var(impi)) = $null;
            sl_send_reply("403", "Authentication failed");
            exit;
        }
        # An initial registration, also one that arrives while reg-await-auth runs (clause 5.4.1.2.3).
        route(AKA_CHALLENGE);
    }
    if ($sht(aka_await=>$var(impi)) != $null) {
        # Clause 5.4.1.2.2 (reg-await-auth running) steps 1 to 4, and clause 5.4.1.2.3A: the answer to the last
        # challenge, on its Call-ID, with the expected response; anything else is 403 (Forbidden).
        if ($sht(aka_await=>$var(impi)) != $ci) {
            $sht(aka_await=>$var(impi)) = $null;
            sl_send_reply("403", "Call-ID does not match the challenge");
            exit;
        }
        $sht(aka_await=>$var(impi)) = $null;
        route(AKA_AUTHENTICATE);
        if (!$var(aka_ok)) { sl_send_reply("403", "Authentication failed"); exit; }
    } else {
        # Clause 5.4.1.2.3A: protected, but no registered user with these identities.
        if (!registered("location", "$var(impu)")) { sl_send_reply("500", "Server Internal Error"); exit; }
        # Clause 5.4.1.2.2 (no reg-await-auth) step 1 and TS 33.203 clause 7.4: every re-registration is authenticated
        # anew, so that new security associations are set up; a deregistration over the established ones is not
        # (step 2).
        if ($(hdr(Expires){s.trim}) != "0" && $(ct{tobody.params}{param.value,expires}) != "0") { route(AKA_CHALLENGE); }
        # The removed contact with expires=0 in the 200 (OK), from which the P-CSCF removes its registration and the
        # security associations (TS 24.229 clause 5.2.2.1, TS 33.203 clause 7.4).
        append_to_reply("Contact: <$(ct{nameaddr.uri})>;expires=0\r\n");
    }
    $var(client_user) = $tU;
    # Clause 5.4.1.2.2F b): the registered public user identity, the only one of its implicit registration set; the
    # P-CSCF asserts it (clause 5.2.6.3).
    append_to_reply("P-Associated-URI: <$var(impu)>\r\n");
    # Clause 5.4.1.2.2 step 9 (Service-Route): the core itself, for the requests the user originates.
#!ifdef SIP_DEBUG_NO_TLS
    append_to_reply("Service-Route: <sip:orig@sip-core:5060;transport=tcp;lr>\r\n");
#!else
    append_to_reply("Service-Route: <sip:orig@sip-core:5061;transport=tls;lr>\r\n");
#!endif
    # TS 24.229 clause 5.4.1.2.2 step 6 d), RFC 5626 clause 6: a registration flow through the P-CSCF (reg-id, and
    # "ob" in its Path) is answered with the outbound option-tag.
    if ($(hdr(Contact)[*]) =~ "reg-id" && $(hdr(Supported)[*]) =~ "(^|[[:space:],])outbound([[:space:],]|$)"
            && $(hdr(Path)[0]) =~ ";ob") {
        append_to_reply("Require: outbound\r\n");
    }
    if (!save("location")) { sl_reply_error(); exit; }
    route(THIRD_PARTY_REGISTER);
    exit;
}

# The vector source (decision D1): the IMPI's K, OPc and AMF for ims_auth, which makes the vector itself (TS 33.102
# clause 6.3.2, Milenage TS 35.206). An HSS over Cx (TS 29.228 clause 6.3.1) would replace this route, the av_mode
# modparam and the K, OPc and AMF columns; the routes calling it stay.
route[AKA_VECTOR_DATA] {
    sql_xquery("sipdb", "SELECT HEX(k) AS k, HEX(opc) AS opc, HEX(amf) AS amf FROM ims_subscription WHERE impi = $(var(impi){sql.val.str})", "keys");
    if ($xavp(keys=>k) == $null) {
        xlog("L_ERR", "no IMS AKA key data for $var(impi)\n");
        sl_send_reply("403", "No authentication data");
        exit;
    }
    ims_auth_data_set("$xavp(keys=>k)", "", "$xavp(keys=>opc)", "$xavp(keys=>amf)");
    return;
}

# TS 24.229 clauses 5.4.1.2.1 steps 3, 5 to 7 and 5.4.1.2.1A, TS 33.203 clause 6.1.1: a 401 (Unauthorized) with a new
# vector in two challenges, AKAv2-SHA-256 then AKAv1-MD5: realm, nonce (base64 of RAND and AUTN), algorithm, qop, and
# ck and ik for the P-CSCF, which removes them. Timer reg-await-auth starts, bound to this Call-ID.
route[AKA_CHALLENGE] {
    route(AKA_VECTOR_DATA);
    $sht(aka_await=>$var(impi)) = $ci;
    ims_www_challenge("AKA_NO_SUSPEND", "@DOMAIN@", "AKAv1-MD5");
    exit;
}

# TS 24.229 clause 5.4.1.2.2 steps 3 b) and 4: the response against the vector's XRES, by the algorithm the
# Authorization names (RFC 4169 with SHA-256 for AKAv2-SHA-256, RFC 3310 for AKAv1-MD5); $var(aka_ok) is 1 on a match.
route[AKA_AUTHENTICATE] {
    $var(aka_ok) = 0;
    if (ims_www_authenticate("@DOMAIN@")) { $var(aka_ok) = 1; }
    return;
}

# TS 24.229 clause 5.4.1.2.3A, TS 33.102 clause 6.3.5: resynchronisation from AUTS and the RAND of the last challenge;
# a failed one abandons the authentication with 403 (Forbidden).
route[AKA_RESYNC] {
    xlog("L_INFO", "IMS AKA resynchronisation from AUTS for $aU\n");
    route(AKA_VECTOR_DATA);
    if (!ims_www_resync_auth("AKA_NO_SUSPEND", "@DOMAIN@")) { sl_send_reply("403", "Resynchronisation failed"); exit; }
    return;
}

# The route ims_auth would resume after an HSS answer; vectors made here never suspend the transaction.
route[AKA_NO_SUSPEND] {
    exit;
}
#!endif
