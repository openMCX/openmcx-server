# openMCX: MCX over the OAI 5G core and the OAI RAN in rfsimulator mode (tutorials/end-to-end/03-mcx-over-oai-5g/README.md).
#
# Tutorial 1's openMCX system, on the 5G core's N6 network, with the OAI 5G core (NRF, UDR, UDM, AUSF, AMF, SMF, PCF,
# UPF; the PCF, SMF and UPF patched for N5, see oai/cn5g/), the OAI gNB and one nr-UE over the
# rfsimulator, and a dispatcher position inside the nr-UE: its traffic crosses the 5G user plane. The phones stay on
# the Wi-Fi (HOST_IP), as in tutorial 1. The MCPTT server asks the PCF for MCPTT QoS over N5 for the dispatcher's
# calls (5QI 65 for its speech).
#
#   cp .env.example .env                                             then set HOST_IP in .env
#   sudo ./host-network.sh add                                       the route to the UE pool, once
#   docker compose -f docker-compose-5g-mcx.yaml run --rm setup      once: writes ./config
#   docker compose -f docker-compose-5g-mcx.yaml up -d
#   open https://HOST_IP:8446/ (MCX Admin) and http://localhost:8080/ (the dispatcher)
#
# Networks: openmcx-5g-core 192.168.71.128/26 (N2, N3, N4, SBI, N5), openmcx-5g-n6 192.168.72.128/26 (N6 and the
# openMCX system); the UE pool 12.1.1.0/24 (DNN mcptt).

name: openmcx-5g
include:
- docker-compose-5g-core.yaml
services:
  oai-gnb:
    container_name: openmcx-oai-gnb
    image: oaisoftwarealliance/oai-gnb:${RAN_TAG:-2026.w39}
    cap_add:
    - SYS_NICE
    cap_drop:
    - ALL
    environment:
      USE_ADDITIONAL_OPTIONS: -E --rfsim --log_config.global_log_options level,nocolor,time
      ASAN_OPTIONS: detect_leaks=0
    depends_on:
    - oai-upf
    networks:
      public:
        ipv4_address: 192.168.71.140
    volumes:
    - ./oai/gnb.sa.band78.106prb.rfsim.yaml:/opt/oai-gnb/etc/gnb.yaml:ro
    healthcheck:
      test: /bin/bash -c "pgrep nr-softmodem"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
  oai-nr-ue:
    container_name: openmcx-oai-nr-ue
    image: oaisoftwarealliance/oai-nr-ue:${RAN_TAG:-2026.w39}
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    - NET_RAW
    - SYS_NICE
    devices:
    - /dev/net/tun:/dev/net/tun
    depends_on:
    - oai-gnb
    environment:
      USE_ADDITIONAL_OPTIONS: -E --rfsim -r 106 --numerology 1 --uicc0.imsi 208990100001100 -C 3319680000 --rfsimulator.[0].serveraddr
        192.168.71.140 --log_config.global_log_options level,nocolor,time
    volumes:
    - ./oai/nrue.uicc.mcptt.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml:ro
    ports:
    - 127.0.0.1:8080:8080
    extra_hosts:
    - sip-core:${HOST_IP:?set HOST_IP in .env}
    networks:
      public:
        ipv4_address: 192.168.71.150
    healthcheck:
      test: /bin/bash -c "pgrep nr-uesoftmodem"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
  ue-route:
    container_name: openmcx-ue-route
    image: oaisoftwarealliance/oai-nr-ue:${RAN_TAG:-2026.w39}
    network_mode: service:oai-nr-ue
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    depends_on:
    - oai-nr-ue
    environment:
      HOST_IP: ${HOST_IP:?set HOST_IP in .env}
    entrypoint:
    - bash
    - -c
    - until ip -4 -o addr show oaitun_ue1 2>/dev/null | grep -q inet; do sleep 1; done; ip route replace "$$HOST_IP"/32 dev
      oaitun_ue1; ip -4 -o addr show oaitun_ue1 | awk '{print $$4}' | cut -d/ -f1 > /ue/ip; echo "UE address $$(cat /ue/ip),
      $$HOST_IP through oaitun_ue1"; sleep infinity
    volumes:
    - ue:/ue
    healthcheck:
      test:
      - CMD
      - test
      - -s
      - /ue/ip
      interval: 3s
      timeout: 2s
      retries: 100
  dispatcher:
    container_name: openmcx-dispatcher
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-dispatcher:${OPENMCX_TAG:-v1}
    network_mode: service:oai-nr-ue
    depends_on:
      ue-route:
        condition: service_healthy
    environment:
      HOST_IP: ${HOST_IP:?set HOST_IP in .env}
    entrypoint:
    - sh
    - -c
    - DISPATCHER_IP=$$(cat /ue/ip) && sed -e "s/DISPATCHER_IP/$$DISPATCHER_IP/g" -e "s/HOST_IP/$$HOST_IP/g" /tutorials/device.json.in
      > /run/mcx/device.json && OLD=$$(cat /data/ue-ip 2>/dev/null || true) && if [ -n "$$OLD" ] && [ "$$OLD" != "$$DISPATCHER_IP"
      ]; then for f in /data/accounts/*/config.json; do [ -f "$$f" ] && sed -i "s/\"$$OLD\"/\"$$DISPATCHER_IP\"/g" "$$f";
      done; fi && echo "$$DISPATCHER_IP" > /data/ue-ip && exec dispatcher --listen 0.0.0.0:8080 --device /run/mcx/device.json
      --data /data --outbox /data/outbox
    volumes:
    - ./setup/device.json.in:/tutorials/device.json.in:ro
    - ue:/ue:ro
    - dispatcher-data:/data
    tmpfs:
    - /run/mcx
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:8080/api/session
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  ue: null
  dispatcher-data: null
