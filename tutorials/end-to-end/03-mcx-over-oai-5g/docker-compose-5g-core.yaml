    - ./oai/mysql-healthcheck.sh:/tmp/mysql-healthcheck.sh:ro
    environment:
      TZ: Europe/Paris
      MYSQL_DATABASE: oai_db
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: linux
    healthcheck:
      test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      public:
        ipv4_address: 192.168.71.131
        aliases:
        - mysql
