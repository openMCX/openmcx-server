# OpenMCX: tutorial 1's OpenMCX system on the N6 network, and the OAI 5G core with the AMF, PCF, SMF and UPF patched
# for N5 (oai/cn5g/). Tutorials 3 (OAI RAN) and 4 (srsRAN) include this file and add the RAN, the UE and the dispatcher;
# start it through their compose files, not alone.
#
# Networks: openmcx-5g-core 192.168.71.128/26 (N2, N3, N4, SBI, N5), openmcx-5g-n6 192.168.72.128/26 (N6 and the
# OpenMCX system); the UE pool 12.1.1.0/24 (DNN mcptt).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  setup:
    logging: *logging
    container_name: openmcx-setup
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-setup:${OPENMCX_TAG:-1.0.0}
    profiles:
    - setup
    environment:
      HOST_IP: ${HOST_IP:?set HOST_IP in .env to this computer's address on the Wi-Fi}
      TUTORIAL_COMPOSE: docker-compose-5g-mcx.yaml
    volumes:
    - .:/work
    - ./setup/pcf.py:/tutorial3/pcf.py:ro
    entrypoint:
    - sh
    - -c
    - python3 /opt/tutorials/configure.py && python3 /tutorial3/pcf.py
  sip-db:
    logging: *logging
    container_name: openmcx-sip-db
    image: mysql@sha256:a08db11d440f1426eb47fbdf7cf2e458aa11bc79341bd2a5461f0296f1272f88
    environment:
      MYSQL_DATABASE: mcx
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      MYSQL_USER: mcx
    volumes:
    - sip-db:/var/lib/mysql
    - ./config/mysql-password:/run/secrets/mysql-password:ro
    - ./config/mysql-root-password:/run/secrets/mysql-root-password:ro
    - ./config/sip-db.sql:/docker-entrypoint-initdb.d/01-subscriber.sql:ro
    - ./config/mcxadmin.sql:/docker-entrypoint-initdb.d/02-mcxadmin.sql:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD=$$(cat /run/secrets/mysql-root-password) mysql -h 127.0.0.1 -u root -D mcx -e "SELECT 1 FROM subscriber
        LIMIT 1" >/dev/null
      timeout: 3s
      interval: 3s
      retries: 40
  sip-core:
    logging: *logging
    container_name: openmcx-sip-core
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-kamailio:${OPENMCX_TAG:-1.0.0}
    command:
    - -DD
    - -E
    - -A
    - CLIENT_SDP_CHECK
    - -A
    - CORE_RPC
    - -f
    - /config/kamailio.cfg
    ports:
    - 5061:5061
    volumes:
    - ./config/kamailio.cfg:/config/kamailio.cfg:ro
    - ./config/tls.cfg:/config/tls.cfg:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/sip-core.crt:/config/tls/sip-core.crt:ro
    - ./config/tls/sip-core.key:/config/tls/sip-core.key:ro
    - ./config/crl:/crl:ro
    depends_on:
      sip-db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - test -r /proc/1/comm && nc -z 127.0.0.1 5061
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  idms:
    logging: *logging
    container_name: openmcx-idms
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-1.0.0}
    entrypoint:
    - /usr/local/bin/mcx-common
    command:
    - --role
    - idms
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/idms.crt
    - --tls-key
    - /config/tls/idms.key
    - --signing-key
    - /config/oidc-private.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs:
    - /run/mcx
    ports:
    - 8443:8443
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/idms.crt:/config/tls/idms.crt:ro
    - ./config/tls/idms.key:/config/tls/idms.key:ro
    - ./config/oidc-private.pem:/config/oidc-private.pem:ro
    - ./config/idms-data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --cacert
      - /config/tls/ca.crt
      - https://idms:8443/readyz
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
