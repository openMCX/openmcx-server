      idms:
        condition: service_healthy
      sip-core:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python3
      - /healthcheck.py
      - /artifacts/mcvideo-server/status.json
      - ready
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  mcxadmin:
    logging: *logging
    container_name: openmcx-mcxadmin
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-admin:${OPENMCX_TAG:-1.0.0}
    command:
    - --config
    - /config/mcxadmin.json
    - --seed
    - /config/site.json
    ports:
    - 8446:8443
    volumes:
    - ./config/site.json:/config/site.json:ro
    - ./config/mcxadmin.json:/config/mcxadmin.json:ro
    - ./config/mcxadmin-dsn:/config/mcxadmin-dsn:ro
    - ./config/server-secret:/config/server-secret:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcxadmin.crt:/config/tls/mcxadmin.crt:ro
    - ./config/tls/mcxadmin.key:/config/tls/mcxadmin.key:ro
    - userdb:/shared
    depends_on:
      sip-db:
        condition: service_healthy
      credentials:
        condition: service_healthy
      gms:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --cacert
      - /config/tls/ca.crt
      - https://mcxadmin:8443/healthz
      interval: 2s
      timeout: 3s
      retries: 60
