# OpenMCX: MCX over the Open5GS 4G core and the OAI LTE RAN in rfsimulator mode (tutorials/end-to-end/05-mcx-over-4g-open5gs-oai/README.md).
#
# Tutorial 1's OpenMCX system, on the EPC's SGi network, with the Open5GS EPC (HSS, MME, S-GW, P-GW, PCRF; the PCRF
# patched for MCPTT QoS, see open5gs/), the OAI eNB and one LTE UE (patched, see oai/ran/) over the rfsimulator, and a
# dispatcher position inside the LTE UE: its traffic crosses the LTE radio and the EPC. The phones stay on the Wi-Fi
# (HOST_IP), as in tutorial 1. The MCPTT server asks the PCRF for MCPTT QoS over Rx for the dispatcher's calls (a
# dedicated bearer with QCI 65 for its speech). A second MC client in the LTE UE, the Linux client of the test user
# client-d (ue-client), registers with IMS AKA through the P-CSCF (pcscf, IPsec ESP over the LTE user plane; TS 33.203);
# the dispatcher and the phones keep SIP digest over TLS (non-3GPP access, TS 33.180 clause 6.2.1).
#
#   cp .env.example .env                                             then set HOST_IP in .env
#   sudo ./host-network.sh add                                       the route to the UE pool, once
#   docker compose -f docker-compose-4g-mcx.yaml run --rm setup      once: writes ./config
#   docker compose -f docker-compose-4g-mcx.yaml up -d                (the host needs the xfrm_user, esp4, authenc,
#                                                                      hmac(sha1) and cbc(aes) kernel modules)
#   open https://HOST_IP:8446/ (MCX Admin) and http://localhost:8080/ (the dispatcher)
#
# Networks: openmcx-4g-core 192.168.73.128/26 (S1, S11, S5, S6a, Gx, Rx), openmcx-4g-sgi 192.168.74.128/26 (SGi and
# the OpenMCX system, the P-CSCF at 192.168.74.140); the UE pool 10.45.0.0/16 (APN oai.ipv4).

name: openmcx-4g
include:
- docker-compose-4g-core.yaml
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  oai-enb:
    logging: *logging
    container_name: openmcx-oai-enb
    image: ${ENB_IMG:-openmcx/oai-enb:2026.w39-mcx}
    privileged: true
    environment:
      USE_ADDITIONAL_OPTIONS: --rfsim --log_config.global_log_options level,nocolor,time
    depends_on:
      epc-mme:
        condition: service_healthy
    networks:
      public:
        ipv4_address: 192.168.73.140
    volumes:
    - ./oai/ran/enb.conf:/opt/oai-enb/etc/enb.conf:ro
    healthcheck:
      # Healthy once the S1 association with the MME is up (SCTP to port 36412), so that the UE attaches through it.
      test: /bin/bash -c "pgrep lte-softmodem && grep -q ' 36412 ' /proc/net/sctp/assocs"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
  oai-lte-ue:
    logging: *logging
    container_name: openmcx-oai-lte-ue
    image: ${UE_IMG:-openmcx/oai-lte-ue:2026.w39-mcx}
    privileged: true
    depends_on:
      oai-enb:
        condition: service_healthy
    environment:
      USE_ADDITIONAL_OPTIONS: --rfsim -C 2680000000 -r 25 --ue-rxgain 140 --ue-txgain 120 --rfsimulator.[0].serveraddr
        192.168.73.140 --log_config.global_log_options level,nocolor,time
    volumes:
    - ./oai/ran/ue_usim.conf:/opt/oai-lte-ue/etc/ue_usim.conf:ro
    - ./oai/ran/ue.conf:/opt/oai-lte-ue/etc/ue.conf:ro
    ports:
    - 127.0.0.1:8080:8080
    extra_hosts:
    - sip-core:${HOST_IP:?set HOST_IP in .env}
    - pcscf:192.168.74.140
    networks:
      public:
        ipv4_address: 192.168.73.150
    healthcheck:
      test: /bin/bash -c "pgrep lte-uesoftmodem"
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
  ue-route:
    logging: *logging
    container_name: openmcx-ue-route
    image: ${UE_IMG:-openmcx/oai-lte-ue:2026.w39-mcx}
    network_mode: service:oai-lte-ue
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    depends_on:
    - oai-lte-ue
    environment:
      HOST_IP: ${HOST_IP:?set HOST_IP in .env}
    entrypoint:
    - bash
    - -c
    - rm -f /ue/ip; until ip -4 -o addr show oaitun_ue1 2>/dev/null | grep -q inet; do sleep 1; done; ip route replace "$$HOST_IP"/32 dev
      oaitun_ue1; ip route replace 192.168.74.140/32 dev oaitun_ue1; ip -4 -o addr show oaitun_ue1 | awk '{print $$4}' | cut
      -d/ -f1 > /ue/ip; echo "UE address $$(cat /ue/ip), $$HOST_IP and the P-CSCF 192.168.74.140 through oaitun_ue1"; sleep
      infinity
    volumes:
    - ue:/ue
    healthcheck:
      test:
      - CMD
      - test
      - -s
      - /ue/ip
      interval: 3s
      timeout: 2s
      retries: 100
  dispatcher:
    logging: *logging
    container_name: openmcx-dispatcher
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-dispatcher:${OPENMCX_TAG:-develop}
    network_mode: service:oai-lte-ue
    depends_on:
      ue-route:
        condition: service_healthy
    environment:
      HOST_IP: ${HOST_IP:?set HOST_IP in .env}
      MCX_LOG: ${MCX_LOG:-info}
    entrypoint:
    - sh
    - -c
    - DISPATCHER_IP=$$(cat /ue/ip) && sed -e "s/DISPATCHER_IP/$$DISPATCHER_IP/g" -e "s/HOST_IP/$$HOST_IP/g" /tutorials/device.json.in
      > /run/mcx/device.json && OLD=$$(cat /data/ue-ip 2>/dev/null || true) && if [ -n "$$OLD" ] && [ "$$OLD" != "$$DISPATCHER_IP"
      ]; then for f in /data/accounts/*/config.json; do [ -f "$$f" ] && sed -i "s/\"$$OLD\"/\"$$DISPATCHER_IP\"/g" "$$f";
      done; fi && echo "$$DISPATCHER_IP" > /data/ue-ip && exec dispatcher --listen 0.0.0.0:8080 --device /run/mcx/device.json
      --data /data --outbox /data/outbox
    volumes:
    - ./setup/device.json.in:/tutorials/device.json.in:ro
    - ue:/ue:ro
    - dispatcher-data:/data
    tmpfs:
    - /run/mcx
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - http://127.0.0.1:8080/api/session
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # The P-CSCF of IMS AKA (docker/pcscf.cfg; TS 24.229 clause 5.2, TS 33.203 clause 7): the UE's initial REGISTER on
  # port 5060, then the IPsec ESP security associations with the UE (transport mode; NET_ADMIN, bound to PCSCF_IP), and
  # TLS to the SIP core with its own certificate. On the SGi network, reached by the UE through the P-GW's UPF without
  # NAT (ESP does not cross Docker's port publishing); it examines its UEs' SDP as the SIP core does the others'.
  pcscf:
    logging: *logging
    container_name: openmcx-pcscf
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-kamailio:${OPENMCX_TAG:-develop}
    cap_add:
    - NET_ADMIN
    environment:
      PCSCF_IP: 192.168.74.140
    command:
    - -DD
    - -E
    - -A
    - CLIENT_SDP_CHECK
    - -f
    - /config/pcscf.cfg
    volumes:
    - ./config/pcscf.cfg:/config/pcscf.cfg:ro
    - ./config/pcscf-tls.cfg:/config/pcscf-tls.cfg:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/pcscf.crt:/config/tls/pcscf.crt:ro
    - ./config/tls/pcscf.key:/config/tls/pcscf.key:ro
    depends_on:
      sip-core:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 192.168.74.140
    healthcheck:
      test:
      - CMD-SHELL
      - nc -z 127.0.0.1 5060
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  # The P-CSCF's route to the UE pool through the UPF's SGi address (the Kamailio image has no ip command).
  pcscf-route:
    logging: *logging
    container_name: openmcx-pcscf-route
    image: ${UE_IMG:-openmcx/oai-lte-ue:2026.w39-mcx}
    network_mode: service:pcscf
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    depends_on:
    - pcscf
    entrypoint:
    - bash
    - -c
    - ip route replace 10.45.0.0/16 via 192.168.74.134 && echo "UE pool 10.45.0.0/16 via the UPF 192.168.74.134" &&
      sleep infinity
    healthcheck:
      test:
      - CMD-SHELL
      - ip route show 10.45.0.0/16 | grep -q 192.168.74.134
      interval: 3s
      timeout: 2s
      retries: 20
  # The MC client in the LTE UE (the Linux client, test user client-d; tutorial 3's setup/ue-client.py): IMS AKA with its software
  # ISIM through the P-CSCF, its security associations in the LTE UE's network namespace (NET_ADMIN); the OIDC
  # sign-in, the HTTP proxy and the KMS at HOST_IP, as for the dispatcher. TS 37.579-2 test 5.1 (tutorial 7's README).
  ue-client:
    logging: *logging
    container_name: openmcx-ue-client
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-client:${OPENMCX_TAG:-develop}
    network_mode: service:oai-lte-ue
    cap_add:
    - NET_ADMIN
    depends_on:
      ue-route:
        condition: service_healthy
      pcscf-route:
        condition: service_healthy
      pcscf:
        condition: service_healthy
      http-proxy:
        condition: service_healthy
      mcptt-server:
        condition: service_healthy
      mcdata-server:
        condition: service_healthy
      mcvideo-server:
        condition: service_healthy
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    entrypoint:
    - sh
    - -c
    - sed "s/UE_IP/$$(cat /ue/ip)/g" /config/ue-client.json.in > /run/mcx/ue-client.json && exec /usr/local/bin/mcx-client
      --config /run/mcx/ue-client.json
    volumes:
    - ./config/ue-client.json:/config/ue-client.json.in:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/client-d.crt:/config/tls/client-d.crt:ro
    - ./config/tls/client-d.key:/config/tls/client-d.key:ro
    - ./config/artifacts:/artifacts
    - ue:/ue:ro
    tmpfs:
    - /run/mcx
    init: true
    healthcheck:
      test:
      - CMD
      - python3
      - /healthcheck.py
      - /artifacts/client-d/status.json
      - authorized
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
volumes:
  ue: null
  dispatcher-data: null
