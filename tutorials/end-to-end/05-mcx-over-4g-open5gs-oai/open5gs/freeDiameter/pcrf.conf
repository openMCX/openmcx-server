# freeDiameter of the pcrf (tutorial 5). Peers without TLS; TLS_Cred is required by freeDiameter: the setup
# generates the certificates (config/epc-tls).
Identity = "pcrf.epc.mcx.test";
Realm = "epc.mcx.test";
No_SCTP;
TLS_Cred = "/opt/open5gs/etc/epc-tls/pcrf.crt", "/opt/open5gs/etc/epc-tls/pcrf.key";
TLS_CA = "/opt/open5gs/etc/epc-tls/ca.crt";
LoadExtension = "/opt/open5gs/lib/x86_64-linux-gnu/freeDiameter/dict_rfc5777.fdx";
LoadExtension = "/opt/open5gs/lib/x86_64-linux-gnu/freeDiameter/dict_mip6i.fdx";
LoadExtension = "/opt/open5gs/lib/x86_64-linux-gnu/freeDiameter/dict_nasreq.fdx";
LoadExtension = "/opt/open5gs/lib/x86_64-linux-gnu/freeDiameter/dict_nas_mipv6.fdx";
LoadExtension = "/opt/open5gs/lib/x86_64-linux-gnu/freeDiameter/dict_dcca.fdx";
LoadExtension = "/opt/open5gs/lib/x86_64-linux-gnu/freeDiameter/dict_dcca_3gpp.fdx";
ConnectPeer = "smf.epc.mcx.test" { ConnectTo = "192.168.73.133"; TcTimer = 10; TwTimer = 30; No_TLS; };
# Rx: the MCPTT server (TS 29.214, MCPTT-5) connects in; its identity is from the openMCX configuration.
ConnectPeer = "mcptt-server.mcx.test" { Realm = "mcx.test"; TcTimer = 10; TwTimer = 30; No_TLS; };
