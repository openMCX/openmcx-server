# OpenMCX with Keycloak as its IdMS (tutorials/end-to-end/08-keycloak-idms/README.md).
#
# The MCPTT and MCData servers, the common services (GMS, CMS, KMS, LMS, content server, message store, notification
# server, HTTP proxy, user database) and the SIP core, from the OpenMCX images; Keycloak, from its own image, in the
# place of OpenMCX's IdMS; a dispatcher for this computer's browser. Two phones on the same Wi-Fi reach the
# system through this computer (HOST_IP); the phones and the dispatcher's operator sign in on Keycloak's page.
#
#   cp .env.example .env                                              then set HOST_IP in .env
#   docker compose -f docker-compose-keycloak.yaml run --rm setup     once: writes ./config
#   docker compose -f docker-compose-keycloak.yaml up -d
#   open http://127.0.0.1:8080/   (the dispatcher; Keycloak's console and the passwords: config/ADMIN.txt)
#
# Ports published on this computer (phones and browser):
#   5061/tcp          SIP core (TLS)
#   8443/tcp          Keycloak (sign-in, and its admin console)
#   8444/tcp          HTTP proxy (CMS, GMS, LMS, files)
#   4000-4199/udp     MCPTT speech, 5000-5199/udp MCPTT floor control
# and for the dispatcher, on this computer's network: 8080/tcp (its page, 127.0.0.1 only), 5071/tcp (SIP),
# 4400/udp and 5400/udp (speech and floor control), 7700-7701/udp (audio to the browser, 127.0.0.1 only).
#
# Images: ${OPENMCX_IMAGE_PREFIX}openmcx-<program>:${OPENMCX_TAG} and ${KEYCLOAK_IMAGE} (.env.example); the generated
# configuration stays in ./config, the data in Docker volumes (`down -v` removes them).

name: openmcx-keycloak

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-off: writes ./config (a new CA, the users, the servers, Keycloak's realm, the phones' and the dispatcher's
  # files) for HOST_IP. Not started by `up`.
  setup:
    logging: *logging
    container_name: openmcx-kc-setup
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-setup:${OPENMCX_TAG:-develop}
    entrypoint: [python3, /opt/tutorials-08/configure.py]
    profiles: [setup]
    environment:
      HOST_IP: ${HOST_IP:?set HOST_IP in .env to this computer's address on the Wi-Fi}
    volumes: ['.:/work']

  # SIP core: Kamailio, with its MySQL. CLIENT_SDP_CHECK: it checks each client's SDP address against the sender's, so
  # that the MCPTT server can accept the phones' own addresses.
  sip-db:
    logging: *logging
    container_name: openmcx-kc-sip-db
    image: mysql@sha256:a08db11d440f1426eb47fbdf7cf2e458aa11bc79341bd2a5461f0296f1272f88
    environment:
      MYSQL_DATABASE: mcx
      MYSQL_PASSWORD_FILE: /run/secrets/mysql-password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      MYSQL_USER: mcx
    volumes:
    - sip-db:/var/lib/mysql
    - ./config/mysql-password:/run/secrets/mysql-password:ro
    - ./config/mysql-root-password:/run/secrets/mysql-root-password:ro
    - ./config/sip-db.sql:/docker-entrypoint-initdb.d/01-subscriber.sql:ro
    healthcheck:
      test: [CMD-SHELL, MYSQL_PWD=$$(cat /run/secrets/mysql-root-password) mysql -h 127.0.0.1 -u root -D mcx -e "SELECT 1 FROM subscriber LIMIT 1" >/dev/null]
      timeout: 3s
      interval: 3s
      retries: 40
  sip-core:
    logging: *logging
    container_name: openmcx-kc-sip-core
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-kamailio:${OPENMCX_TAG:-develop}
    command: [-DD, -E, -A, CLIENT_SDP_CHECK, -f, /config/kamailio.cfg]
    ports: ['5061:5061']
    volumes:
    - ./config/kamailio.cfg:/config/kamailio.cfg:ro
    - ./config/tls.cfg:/config/tls.cfg:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/sip-core.crt:/config/tls/sip-core.crt:ro
    - ./config/tls/sip-core.key:/config/tls/sip-core.key:ro
    depends_on:
      sip-db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, test -r /proc/1/comm && nc -z 127.0.0.1 5061]
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s

  # The IdMS: Keycloak, with the realm "openmcx" the setup wrote (the users and their MC service IDs, the MC scopes,
  # the OAuth client and its claim mappers), signing with the system's IdMS key. It answers at HOST_IP, where the
  # phones' browser, this computer's browser and the servers reach it.
  idms:
    logging: *logging
    container_name: openmcx-kc-idms
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.3.3}
    command:
    - start
    - --import-realm
    - --hostname=https://${HOST_IP:?set HOST_IP in .env}:8443
    - --https-port=8443
    - --http-enabled=false
    - --https-certificate-file=/opt/keycloak/conf/idms.crt
    - --https-certificate-key-file=/opt/keycloak/conf/idms.key
    - --health-enabled=true
    env_file:
    - path: ./config/keycloak/admin.env
      required: false
    ports: ['8443:8443']
    volumes:
    - ./config/tls/idms.crt:/opt/keycloak/conf/idms.crt:ro
    - ./config/tls/idms.key:/opt/keycloak/conf/idms.key:ro
    - ./config/keycloak/openmcx.json:/opt/keycloak/data/import/openmcx.json:ro
    healthcheck:
      # The management port opens once the realm is imported.
      test: [CMD-SHELL, 'exec 3<>/dev/tcp/127.0.0.1/9000']
      timeout: 3s
      interval: 3s
      retries: 100

  # Common services (one image, one role each): GMS, CMS, KMS, LMS, content server, message store, notification
  # server; the HTTP proxy in front of them for the phones; the MCPTT user database.
  gms:
    logging: *logging
    container_name: openmcx-kc-gms
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-common]
    command:
    - --role
    - gms
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/gms.crt
    - --tls-key
    - /config/tls/gms.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/gms.crt:/config/tls/gms.crt:ro
    - ./config/tls/gms.key:/config/tls/gms.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - gms:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://gms:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  cms:
    logging: *logging
    container_name: openmcx-kc-cms
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-common]
    command:
    - --role
    - cms
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/cms.crt
    - --tls-key
    - /config/tls/cms.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/cms.crt:/config/tls/cms.crt:ro
    - ./config/tls/cms.key:/config/tls/cms.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - cms:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://cms:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  kms:
    logging: *logging
    container_name: openmcx-kc-kms
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-common]
    command:
    - --role
    - kms
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/kms.crt
    - --tls-key
    - /config/tls/kms.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/kms.crt:/config/tls/kms.crt:ro
    - ./config/tls/kms.key:/config/tls/kms.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - kms:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://kms:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  lms:
    logging: *logging
    container_name: openmcx-kc-lms
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-common]
    command:
    - --role
    - lms
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/lms.crt
    - --tls-key
    - /config/tls/lms.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/lms.crt:/config/tls/lms.crt:ro
    - ./config/tls/lms.key:/config/tls/lms.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - lms:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://lms:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  content-server:
    logging: *logging
    container_name: openmcx-kc-content-server
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-common]
    command:
    - --role
    - content
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/content-server.crt
    - --tls-key
    - /config/tls/content-server.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/content-server.crt:/config/tls/content-server.crt:ro
    - ./config/tls/content-server.key:/config/tls/content-server.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - content:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://content-server:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  message-store:
    logging: *logging
    container_name: openmcx-kc-message-store
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-common]
    command:
    - --role
    - msgstore
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/message-store.crt
    - --tls-key
    - /config/tls/message-store.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/message-store.crt:/config/tls/message-store.crt:ro
    - ./config/tls/message-store.key:/config/tls/message-store.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - msgstore:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://message-store:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  notification-server:
    logging: *logging
    container_name: openmcx-kc-notification-server
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-common]
    command:
    - --role
    - notification
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/notification-server.crt
    - --tls-key
    - /config/tls/notification-server.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/notification-server.crt:/config/tls/notification-server.crt:ro
    - ./config/tls/notification-server.key:/config/tls/notification-server.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - notification:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://notification-server:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  http-proxy:
    logging: *logging
    container_name: openmcx-kc-http-proxy
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-http-proxy:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-http-proxy]
    command: [--config, /config/http-proxy.json, --tls-cert, /config/tls/http-proxy.crt, --tls-key, /config/tls/http-proxy.key, --ca-file, /config/tls/ca.crt]
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    ports: ['8444:8443']
    volumes:
    - ./config/http-proxy.json:/config/http-proxy.json:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/http-proxy.crt:/config/tls/http-proxy.crt:ro
    - ./config/tls/http-proxy.key:/config/tls/http-proxy.key:ro
    depends_on:
      cms:
        condition: service_healthy
      content-server:
        condition: service_healthy
      gms:
        condition: service_healthy
      lms:
        condition: service_healthy
      message-store:
        condition: service_healthy
      notification-server:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://http-proxy:8443/readyz']
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  mcx-user-db:
    logging: *logging
    container_name: openmcx-kc-mcx-user-db
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-user-db:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/mcx-user-db]
    command: [--config, /config/site.json, --diameter-config, /config/diameter-user-db.conf]
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/site.json:/config/site.json:ro
    - ./config/diameter-user-db.conf:/config/diameter-user-db.conf:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcx-user-db.crt:/config/tls/mcx-user-db.crt:ro
    - ./config/tls/mcx-user-db.key:/config/tls/mcx-user-db.key:ro
    healthcheck:
      test:
      - CMD-SHELL
      - test -r /proc/net/sctp/eps && python3 -c "import pathlib; assert any(int(row.split()[5]) == 3868 for row in pathlib.Path(\"/proc/net/sctp/eps\").read_text().splitlines()[1:])"
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s

  # The MCPTT and MCData servers.
  mcptt-server:
    logging: *logging
    container_name: openmcx-kc-mcptt-server
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-mcptt-server:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/openmcx-mcptt-server]
    command: [--config, /config/mcptt-server.json]
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    ports: ['4000-4199:4000-4199/udp', '5000-5199:5000-5199/udp']
    volumes:
    - ./config/artifacts:/artifacts
    - ./config/mcptt-server.json:/config/mcptt-server.json:ro
    - ./config/diameter-server.conf:/config/diameter-server.conf:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcptt-server.crt:/config/tls/mcptt-server.crt:ro
    - ./config/tls/mcptt-server.key:/config/tls/mcptt-server.key:ro
    depends_on:
      cms:
        condition: service_healthy
      gms:
        condition: service_healthy
      idms:
        condition: service_healthy
      mcx-user-db:
        condition: service_healthy
      sip-core:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /healthcheck.py, /artifacts/mcptt-server/status.json, ready]
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  mcdata-server:
    logging: *logging
    container_name: openmcx-kc-mcdata-server
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-mcdata-server:${OPENMCX_TAG:-develop}
    entrypoint: [/usr/local/bin/openmcx-mcdata-server]
    command: [--config, /config/mcdata-server.json]
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    tmpfs: [/run/mcx]
    volumes:
    - ./config/artifacts:/artifacts
    - ./config/mcdata-server.json:/config/mcdata-server.json:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcdata-server.crt:/config/tls/mcdata-server.crt:ro
    - ./config/tls/mcdata-server.key:/config/tls/mcdata-server.key:ro
    depends_on:
      cms:
        condition: service_healthy
      content-server:
        condition: service_healthy
      gms:
        condition: service_healthy
      idms:
        condition: service_healthy
      sip-core:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /healthcheck.py, /artifacts/mcdata-server/status.json, ready]
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s

  # The dispatcher, on this computer's network as the phones are: client-c, whose operator signs in on
  # Keycloak's page in this computer's browser (dispatcher/README.md, lab mode with oauth.login "browser").
  dispatcher:
    logging: *logging
    container_name: openmcx-kc-dispatcher
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-dispatcher:${OPENMCX_TAG:-develop}
    network_mode: host
    # The SIP core's name, as the configuration names it, at the system's address (its certificate names sip-core).
    extra_hosts:
    - "sip-core:${HOST_IP:?set HOST_IP in .env}"
    environment:
      MCX_LOG: ${MCX_LOG:-info}
    entrypoint: [dispatcher, --listen, '127.0.0.1:8080', --config, /config/dispatcher.json, --outbox, /run/mcx/outbox]
    tmpfs: [/run/mcx]
    volumes:
    - ./config/dispatcher.json:/config/dispatcher.json:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/client-c.crt:/config/tls/client-c.crt:ro
    - ./config/tls/client-c.key:/config/tls/client-c.key:ro
    depends_on:
      idms:
        condition: service_healthy
      mcptt-server:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:8080/api/session']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cms: {}
  content: {}
  gms: {}
  kms: {}
  lms: {}
  msgstore: {}
  notification: {}
  sip-db: {}
