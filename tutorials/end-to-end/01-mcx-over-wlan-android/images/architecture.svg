<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tutorial 1: two phones and a browser reach the OpenMCX system on one computer over the Wi-Fi</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="380" rx="14" fill="#ffffff"/>

  <!-- devices -->
  <g font-size="14" fill="#1f2937">
    <rect x="30" y="40" width="170" height="70" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="115" y="70" text-anchor="middle" font-weight="600">Phone A</text>
    <text x="115" y="92" text-anchor="middle" font-size="12" fill="#4b5563">Alice · OpenMCX app</text>

    <rect x="30" y="150" width="170" height="70" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="115" y="180" text-anchor="middle" font-weight="600">Phone B</text>
    <text x="115" y="202" text-anchor="middle" font-size="12" fill="#4b5563">Bob · OpenMCX app</text>

    <rect x="30" y="260" width="170" height="70" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="115" y="290" text-anchor="middle" font-weight="600">MCX Admin</text>
    <text x="115" y="312" text-anchor="middle" font-size="12" fill="#4b5563">web UI in a browser</text>
  </g>

  <!-- Wi-Fi -->
  <g stroke="#5b6472" stroke-width="1.6" fill="none">
    <path d="M200,75 C255,75 255,185 300,185" marker-end="url(#arrow)"/>
    <path d="M200,185 L300,185" marker-end="url(#arrow)"/>
    <path d="M200,295 C255,295 255,185 300,185" marker-end="url(#arrow)"/>
  </g>
  <rect x="221" y="20" width="58" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
  <text x="250" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Wi-Fi</text>

  <!-- computer -->
  <rect x="305" y="20" width="570" height="340" rx="16" fill="#fff7ed" stroke="#ea8a1a" stroke-width="2"/>
  <text x="325" y="50" font-size="16" font-weight="700" fill="#9a4b05">Computer · HOST_IP</text>
  <text x="855" y="50" text-anchor="end" font-size="12" fill="#9a4b05">OpenMCX system · Docker</text>

  <g font-size="13" fill="#1f2937">
    <rect x="325" y="70" width="530" height="48" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="345" y="99" font-weight="600">MCX Admin</text>
    <text x="440" y="99" fill="#4b5563">console: users, groups, templates, activation codes</text>

    <rect x="325" y="130" width="170" height="64" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="410" y="158" text-anchor="middle" font-weight="600">MCPTT server</text>
    <text x="410" y="178" text-anchor="middle" font-size="12" fill="#4b5563">voice, floor control</text>
    <rect x="505" y="130" width="170" height="64" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="590" y="158" text-anchor="middle" font-weight="600">MCData server</text>
    <text x="590" y="178" text-anchor="middle" font-size="12" fill="#4b5563">messages, files</text>
    <rect x="685" y="130" width="170" height="64" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="770" y="158" text-anchor="middle" font-weight="600">MCVideo server</text>
    <text x="770" y="178" text-anchor="middle" font-size="12" fill="#4b5563">video, transmission</text>

    <rect x="325" y="206" width="530" height="72" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="345" y="233" font-weight="600">Common services</text>
    <text x="345" y="252" fill="#4b5563" font-size="12">IdMS (sign-in) · GMS (groups) · CMS (configuration) · KMS (keys) · LMS (location)</text>
    <text x="345" y="269" fill="#4b5563" font-size="12">Credential Service · content server · message store · notification server</text>

    <rect x="325" y="290" width="530" height="52" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="345" y="321" font-weight="600">SIP core</text>
    <text x="440" y="321" fill="#4b5563">Kamailio + MySQL · registration, routing</text>
  </g>
</svg>
