    - ./config/mcdata-server.json:/config/mcdata-server.json:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcdata-server.crt:/config/tls/mcdata-server.crt:ro
    - ./config/tls/mcdata-server.key:/config/tls/mcdata-server.key:ro
    depends_on:
      cms:
        condition: service_healthy
      content-server:
        condition: service_healthy
      gms:
        condition: service_healthy
      idms:
        condition: service_healthy
      sip-core:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /healthcheck.py, /artifacts/mcdata-server/status.json, ready]
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  mcvideo-server:
    container_name: openmcx-mcvideo-server
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-mcvideo-server:${OPENMCX_TAG:-1.0.0}
    entrypoint: [/usr/local/bin/openmcx-mcvideo-server]
    command: [--config, /config/mcvideo-server.json]
    init: true
    tmpfs: [/run/mcx]
    ports: ['7000-7199:7000-7199/udp', '7200-7399:7200-7399/udp', '7400-7599:7400-7599/udp']
    volumes:
    - ./config/artifacts:/artifacts
    - ./config/mcvideo-server.json:/config/mcvideo-server.json:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcvideo-server.crt:/config/tls/mcvideo-server.crt:ro
    - ./config/tls/mcvideo-server.key:/config/tls/mcvideo-server.key:ro
    depends_on:
      cms:
        condition: service_healthy
      gms:
        condition: service_healthy
      idms:
        condition: service_healthy
      sip-core:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /healthcheck.py, /artifacts/mcvideo-server/status.json, ready]
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s

  # MCX Admin: web console and API for users and groups; activation codes for the phones.
  mcxadmin:
    container_name: openmcx-mcxadmin
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-admin:${OPENMCX_TAG:-1.0.0}
    command: [--config, /config/mcxadmin.json, --seed, /config/site.json]
    ports: ['8446:8443']
    volumes:
    - ./config/site.json:/config/site.json:ro
    - ./config/mcxadmin.json:/config/mcxadmin.json:ro
    - ./config/mcxadmin-dsn:/config/mcxadmin-dsn:ro
    - ./config/server-secret:/config/server-secret:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcxadmin.crt:/config/tls/mcxadmin.crt:ro
    - ./config/tls/mcxadmin.key:/config/tls/mcxadmin.key:ro
    - userdb:/shared
    depends_on:
      sip-db:
        condition: service_healthy
      credentials:
        condition: service_healthy
      gms:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --cacert, /config/tls/ca.crt, 'https://mcxadmin:8443/healthz']
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  cms: {}
  content: {}
  gms: {}
