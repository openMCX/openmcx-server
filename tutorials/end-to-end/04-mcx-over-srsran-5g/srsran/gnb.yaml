# srsRAN Project gNB for tutorial 4: band 3 FDD, 20 MHz, 15 kHz SCS, over the ZeroMQ virtual radio to srsUE.
# PLMN, TAC and slice as tutorial 3's OAI 5G core (oai/mcx_core_config.yaml): 208/99, TAC 1, SST 1.
cu_cp:
  amf:
    addr: 192.168.71.132          # oai-amf (N2)
    port: 38412
    bind_addr: 192.168.71.140
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "20899"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200          # srsUE does not come back after an RRC release; keep the UE connected
  max_nof_drbs_per_ue: 1          # srsUE has one DRB with one QoS flow: a second QoS flow (5QI 65 over N5) is refused
                                  # at once instead of an RRC reconfiguration srsUE cannot apply. srsRAN 25.10 then
                                  # still requests a UE context release (any failed PDU session modification does).
cu_up:
  ngu:
    socket:
      - bind_addr: 192.168.71.140 # N3 towards the UPF
ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://192.168.71.140:2000,rx_port=tcp://192.168.71.150:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75
cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "20899"
  tac: 1
  pci: 1
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 12
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64
log:
  filename: stdout
  all_level: warning
