<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tutorial 7: the MC client of client-d in the nr-UE registers with IMS AKA through the P-CSCF, over the OAI 5G RAN and core, and signs in through the home HTTP proxy</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="900" height="500" rx="14" fill="#ffffff"/>

  <!-- P-CSCF -->
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="40" width="230" height="96" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="145" y="66" text-anchor="middle" font-size="14" font-weight="700">P-CSCF</text>
    <text x="145" y="86" text-anchor="middle" font-size="11" fill="#4b5563">Kamailio · 192.168.72.140 on N6</text>
    <text x="145" y="103" text-anchor="middle" font-size="11" fill="#4b5563">IPsec ESP with the UE (TS 33.203)</text>
    <text x="145" y="120" text-anchor="middle" font-size="11" fill="#4b5563">TLS to the SIP core</text>
  </g>
  <path d="M145,136 L145,185 L328,185" stroke="#3b6fd8" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- OpenMCX system -->
  <rect x="310" y="20" width="565" height="190" rx="16" fill="#fff7ed" stroke="#ea8a1a" stroke-width="2"/>
  <text x="330" y="48" font-size="15" font-weight="700" fill="#9a4b05">Computer · HOST_IP · OpenMCX system</text>
  <text x="855" y="48" text-anchor="end" font-size="12" fill="#9a4b05">on the 5G core's N6 network</text>
  <g font-size="13" fill="#1f2937">
    <rect x="330" y="62" width="525" height="38" rx="9" fill="#ffffff" stroke="#f0b46b"/>
    <text x="348" y="86" font-weight="600">MCX Admin</text>
    <text x="440" y="86" font-size="12" font-weight="600">Common services</text>
    <text x="550" y="86" font-size="12" fill="#4b5563">HTTP proxy · IdMS · GMS · CMS · KMS · LMS</text>
    <rect x="330" y="110" width="170" height="52" rx="9" fill="#ffffff" stroke="#f0b46b"/>
    <text x="415" y="140" text-anchor="middle" font-weight="600">MCPTT server</text>
    <rect x="508" y="110" width="170" height="52" rx="9" fill="#ffffff" stroke="#f0b46b"/>
    <text x="593" y="140" text-anchor="middle" font-weight="600">MCData server</text>
        <rect x="686" y="110" width="169" height="52" rx="9" fill="#ffffff" stroke="#f0b46b"/>
    <text x="770" y="140" text-anchor="middle" font-weight="600">MCVideo server</text>
    <rect x="330" y="170" width="525" height="30" rx="9" fill="#ffffff" stroke="#f0b46b"/>
    <text x="348" y="190" font-size="12" font-weight="600">SIP core</text>
    <text x="425" y="190" font-size="12" fill="#4b5563">Kamailio + MySQL</text>
  </g>

  <!-- nr-UE with the MC client of client-d -->
  <g font-size="13" fill="#1f2937">
    <rect x="30" y="290" width="190" height="150" rx="12" fill="#eef7ee" stroke="#2f8a3b" stroke-width="1.5"/>
    <text x="125" y="315" text-anchor="middle" font-weight="700">nr-UE</text>
    <text x="125" y="333" text-anchor="middle" font-size="11" fill="#4b5563">IMSI …1100 · DNN mcptt · 12.1.1.x</text>
    <rect x="45" y="345" width="160" height="80" rx="8" fill="#ffffff" stroke="#7cbf86"/>
    <text x="125" y="370" text-anchor="middle" font-weight="600">MC client · client-d</text>
    <text x="125" y="389" text-anchor="middle" font-size="11" fill="#4b5563">Linux client · software ISIM</text>
    <text x="125" y="405" text-anchor="middle" font-size="11" fill="#4b5563">IMS AKA · test 5.1</text>
  </g>

  <path d="M95,288 L95,138" stroke="#3b6fd8" stroke-width="2" stroke-dasharray="7 4" fill="none" marker-end="url(#arrow)"/>
  <rect x="20" y="200" width="150" height="38" rx="11" fill="#ffffff" stroke="#3b6fd8"/>
  <text x="95" y="216" text-anchor="middle" font-size="11" font-weight="600" fill="#2a56b0">SIP inside IPsec ESP</text>
  <text x="95" y="231" text-anchor="middle" font-size="10" fill="#2a56b0">over the 5G user plane</text>

  <!-- gNB -->
  <rect x="262" y="330" width="96" height="70" rx="12" fill="#eef7ee" stroke="#2f8a3b" stroke-width="1.5"/>
  <text x="310" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">gNB</text>
  <text x="310" y="381" text-anchor="middle" font-size="11" fill="#4b5563">OAI RAN</text>
  <path d="M220,365 L262,365" stroke="#2f8a3b" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="241" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8a3b">OAI</text>
  <text x="241" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#2f8a3b">RFSIM</text>

  <!-- 5G core -->
  <rect x="395" y="240" width="480" height="240" rx="16" fill="#f0f7f2" stroke="#2f8a3b" stroke-width="2"/>
  <text x="415" y="266" font-size="15" font-weight="700" fill="#1e6b2a">OAI 5G core (CN5G v2.2.1)</text>
  <text x="855" y="266" text-anchor="end" font-size="11" fill="#1e6b2a">red: patched for N5 (oai/cn5g)</text>
  <g font-size="13" font-weight="600" fill="#1f2937" text-anchor="middle">
    <rect x="415" y="282" width="210" height="48" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520" y="302">PCF</text>
    <text x="520" y="320" font-size="11" font-weight="400" fill="#a12d22">policy of the DNN mcptt</text>
    <rect x="640" y="282" width="100" height="48" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690" y="302">SMF</text>
    <text x="690" y="320" font-size="11" font-weight="400" fill="#a12d22">QoS flow</text>
    <rect x="415" y="342" width="100" height="40" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="465" y="367">AMF</text>
    <rect x="755" y="282" width="100" height="48" rx="9" fill="#ffffff" stroke="#7cbf86"/><text x="805" y="311">NRF</text>
    <rect x="528" y="342" width="100" height="40" rx="9" fill="#ffffff" stroke="#7cbf86"/><text x="578" y="367">UDR</text>
    <rect x="641" y="342" width="100" height="40" rx="9" fill="#ffffff" stroke="#7cbf86"/><text x="691" y="367">UDM</text>
    <rect x="755" y="342" width="100" height="40" rx="9" fill="#ffffff" stroke="#7cbf86"/><text x="805" y="367">AUSF</text>
    <rect x="415" y="396" width="440" height="64" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="635" y="421">UPF</text>
    <text x="635" y="442" font-size="11" font-weight="400" fill="#a12d22">user plane · the MCX PDU session · QFI 1 default (5QI 69)</text>
  </g>

  <!-- N2, N3, N6 -->
  <path d="M358,352 L413,352" stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="376" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">N2</text>
  <path d="M358,385 C380,410 390,430 413,430" stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="372" y="440" font-size="12" font-weight="600" fill="#374151">N3</text>
  <path d="M855,428 L886,428 L886,226 L820,226 L820,212" stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="810" y="229" text-anchor="end" font-size="11" font-weight="600" fill="#374151">N6 · to the P-CSCF and, at HOST_IP, the HTTP proxy, IdMS and KMS</text>
</svg>
