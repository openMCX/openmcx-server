    entrypoint: [/usr/local/bin/openmcx-mcptt-server]
    command: [--config, /config/mcptt-server.json, --disable-tls]
    init: true
    tmpfs: [/run/mcx]
    healthcheck:
      test:
      - CMD
      - python3
      - /healthcheck.py
      - /artifacts/mcptt-server/status.json
      - ready
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
    networks:
      mcx:
        ipv4_address: 172.31.18.20
    volumes:
    - status:/artifacts
    - ./config/mcptt-server.json:/config/mcptt-server.json:ro
    - ./config/diameter-server.conf:/config/diameter-server.conf:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/mcptt-server.crt:/config/tls/mcptt-server.crt:ro
    - ./config/tls/mcptt-server.key:/config/tls/mcptt-server.key:ro
    depends_on:
      cms:
        condition: service_healthy
      gms:
        condition: service_healthy
      idms:
        condition: service_healthy
      mcx-user-db:
        condition: service_healthy
      sip-core:
        condition: service_healthy
