# openMCX: Unit Test Tutorial 18, MCVideo pull and push of video, and ambient viewing calls (tutorials/unit-tests/18-mcvideo-pull-push-ambient/README.md).
#
# The regression lab of this feature, from the published images: the MCPTT, MCData and MCVideo servers, the common
# services, the SIP core and four headless clients (client-a to client-d), with SIP in clear (5060/tcp, no
# TLS) and a capture of the lab network (openmcx-ut18) for Wireshark. Nothing is published on this computer.
#
#   docker compose run --rm setup      once: writes ./config
#   docker compose up -d --wait
#   ./run.sh                           the steps; copies the capture to captures/
#
# Addresses on 172.31.18.0/24: sip-core .10, mcptt-server .20, mcvideo-server .22, client-a .101,
# client-b .102, client-c .103, client-d .104.
# Generated by tools/tutorial-compose.py from the lab of tools/prepare-prearranged-test.py --debug-sip --mcvideo.
name: openmcx-ut18
services:
  setup:
    image: docker.io/openmcx/openmcx-setup:1.0.0
    profiles: [setup]
    entrypoint: [sh, -c]
    command:
    - 'set -e; if [ -e /work/config ]; then echo "./config exists: remove it to start over" >&2; exit 1; fi; python3 /opt/mcxserver/tools/prepare-prearranged-test.py
      --directory /tmp/lab --debug-sip --mcvideo >/dev/null; cp -r /tmp/lab/generated /work/config; chown -R "$$(stat -c %u:%g
      /work)" /work/config; echo "wrote ./config (certificates last 30 days)"'
    volumes: ['.:/work']
    network_mode: none
  capture:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    command:
    - tcpdump
    - -Z
    - root
    - -i
    - openmcx-ut18
    - -U
    - -s
    - '0'
    - -w
    - /captures/18-mcvideo-pull-push-ambient-full.pcap
    - ip and not host 172.31.18.1 and (tcp port 5060 or (udp and not port 53) or icmp)
    volumes: ['captures:/captures']
    depends_on:
      sip-core:
        condition: service_started
  sip-core:
    image: docker.io/openmcx/openmcx-kamailio:1.0.0
    command: [-DD, -E, -A, SIP_DEBUG_NO_TLS, -f, /config/kamailio.cfg]
    healthcheck:
      test: [CMD-SHELL, nc -z 127.0.0.1 5060]
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
    networks:
      mcx:
        ipv4_address: 172.31.18.10
    volumes:
    - ./config/kamailio.cfg:/config/kamailio.cfg:ro
    - ./config/tls.cfg:/config/tls.cfg:ro
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/tls/sip-core.crt:/config/tls/sip-core.crt:ro
    - ./config/tls/sip-core.key:/config/tls/sip-core.key:ro
    depends_on:
      sip-db:
        condition: service_healthy
