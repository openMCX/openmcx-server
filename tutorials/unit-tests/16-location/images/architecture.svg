<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Unit Test Tutorial 16: four headless clients report their simulated position to the MCPTT server (and the MCData server), which configures their reporting, answers location requests and tells them about group and emergency alert areas; the OpenMCX system on one computer, on the lab network 172.31.16.0/24</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/>
    </marker>
  </defs>
  <rect width="900" height="380" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="876" height="356" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="32" y="40" font-size="15" font-weight="700" fill="#374151">Computer · Docker · lab network 172.31.16.0/24</text>
  <text x="868" y="40" text-anchor="end" font-size="12" fill="#4b5563">nothing published outside the computer</text>

  <!-- clients -->
  <g font-size="14" fill="#1f2937">
    <rect x="32" y="64" width="190" height="56" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="127" y="88" text-anchor="middle" font-weight="600">client-a · .101</text>
    <text x="127" y="107" text-anchor="middle" font-size="12" fill="#4b5563">alice · requests, configures</text>
    <rect x="32" y="130" width="190" height="56" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="127" y="154" text-anchor="middle" font-weight="600">client-b · .102</text>
    <text x="127" y="173" text-anchor="middle" font-size="12" fill="#4b5563">bob · alert area, periodic</text>
    <rect x="32" y="196" width="190" height="56" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="127" y="220" text-anchor="middle" font-weight="600">client-c · .103</text>
    <text x="127" y="239" text-anchor="middle" font-size="12" fill="#4b5563">group area, shares with alice only</text>
    <rect x="32" y="262" width="190" height="56" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="127" y="286" text-anchor="middle" font-weight="600">client-d · .104</text>
    <text x="127" y="305" text-anchor="middle" font-size="12" fill="#4b5563">may not report its location</text>
  </g>
  <text x="127" y="342" text-anchor="middle" font-size="12" fill="#4b5563">headless clients, run.sh</text>

  <!-- OpenMCX system -->
  <rect x="380" y="56" width="488" height="292" rx="16" fill="#fff7ed" stroke="#ea8a1a" stroke-width="2"/>
  <text x="400" y="82" font-size="15" font-weight="700" fill="#9a4b05">OpenMCX system</text>
  <g font-size="13" fill="#1f2937">
    <rect x="400" y="98" width="200" height="56" rx="10" fill="#ffffff" stroke="#f0b46b" stroke-width="1.5"/>
    <text x="500" y="122" text-anchor="middle" font-weight="600">SIP core · .10</text>
    <text x="500" y="141" text-anchor="middle" font-size="12" fill="#4b5563">Kamailio · SIP 5060/tcp, in clear</text>
    <rect x="400" y="232" width="200" height="56" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="500" y="256" text-anchor="middle" font-weight="600">MCPTT server · .20</text>
    <text x="500" y="275" text-anchor="middle" font-size="12" fill="#4b5563">configures, stores, answers</text>
    <rect x="640" y="98" width="208" height="56" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="744" y="122" text-anchor="middle" font-weight="600">MCData server · .21</text>
    <text x="744" y="141" text-anchor="middle" font-size="12" fill="#4b5563">its own location reporting</text>
    <rect x="640" y="168" width="208" height="120" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="744" y="192" text-anchor="middle" font-weight="600">Common services</text>
    <text x="744" y="212" text-anchor="middle" font-size="12" fill="#4b5563">CMS: who may request, configure</text>
    <text x="744" y="230" text-anchor="middle" font-size="12" fill="#4b5563">LMS: SEAL location (not used here)</text>
    <text x="744" y="248" text-anchor="middle" font-size="12" fill="#4b5563">IdMS · GMS · KMS · HTTP proxy</text>
    <text x="744" y="274" text-anchor="middle" font-size="12" fill="#4b5563">HTTPS: not captured</text>
  </g>

  <!-- SIP: clients to SIP core, SIP core to the servers -->
  <g stroke="#5b6472" stroke-width="1.6" fill="none">
    <path d="M222,92 C300,92 320,118 398,118" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M222,158 C300,158 320,126 398,126" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M222,224 C310,224 320,134 398,134" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M222,290 C330,290 320,142 398,142" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M500,156 L500,230" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M602,126 L638,126" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  </g>
  <rect x="508" y="182" width="40" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
  <text x="528" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">SIP</text>

  <rect x="228" y="320" width="146" height="38" rx="10" fill="#ffffff" stroke="#9ca3af"/>
  <text x="301" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">configurations · reports</text>
  <text x="301" y="351" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">in SIP MESSAGE</text>
</svg>
