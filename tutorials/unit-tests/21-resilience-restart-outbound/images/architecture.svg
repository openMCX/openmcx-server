<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Unit Test Tutorial 21: four headless clients and the openMCX system on one computer, on the lab network 172.31.21.0/24; client-a, the four clients and the MCPTT server restart; bob's device is replaced by a client without a SIP listener that the SIP core reaches over its outbound flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="900" height="400" rx="14" fill="#ffffff"/>
  <rect x="12" y="12" width="876" height="376" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="32" y="40" font-size="15" font-weight="700" fill="#374151">Computer · Docker · lab network 172.31.21.0/24</text>
  <text x="868" y="40" text-anchor="end" font-size="12" fill="#4b5563">nothing published outside the computer</text>

  <!-- clients -->
  <g font-size="14" fill="#1f2937">
    <rect x="32" y="64" width="210" height="56" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="137" y="88" text-anchor="middle" font-weight="600">client-a · .101</text>
    <text x="137" y="107" text-anchor="middle" font-size="12" fill="#4b5563">alice · restarts (step 2)</text>
    <rect x="32" y="130" width="210" height="76" rx="12" fill="#ecfdf3" stroke="#15803d" stroke-width="1.5"/>
    <text x="137" y="154" text-anchor="middle" font-weight="600">client-b · .102</text>
    <text x="137" y="173" text-anchor="middle" font-size="12" fill="#4b5563">bob · step 7: mcx-client stopped,</text>
    <text x="137" y="190" text-anchor="middle" font-size="12" fill="#4b5563">a client without a SIP listener</text>
    <rect x="32" y="216" width="210" height="56" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="137" y="240" text-anchor="middle" font-weight="600">client-c · .103</text>
    <text x="137" y="259" text-anchor="middle" font-size="12" fill="#4b5563">operations · back by itself (step 6)</text>
    <rect x="32" y="282" width="210" height="56" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="137" y="306" text-anchor="middle" font-weight="600">client-d · .104</text>
    <text x="137" y="325" text-anchor="middle" font-size="12" fill="#4b5563">operations · back by itself (step 6)</text>
  </g>
  <text x="137" y="362" text-anchor="middle" font-size="12" fill="#4b5563">headless clients, run.sh</text>

  <!-- openMCX system -->
  <rect x="380" y="56" width="488" height="312" rx="16" fill="#fff7ed" stroke="#ea8a1a" stroke-width="2"/>
  <text x="400" y="82" font-size="15" font-weight="700" fill="#9a4b05">openMCX system</text>
  <g font-size="13" fill="#1f2937">
    <rect x="400" y="98" width="200" height="72" rx="10" fill="#ffffff" stroke="#f0b46b" stroke-width="1.5"/>
    <text x="500" y="122" text-anchor="middle" font-weight="600">SIP core · .10</text>
    <text x="500" y="141" text-anchor="middle" font-size="12" fill="#4b5563">Kamailio · SIP 5060/tcp, in clear</text>
    <text x="500" y="159" text-anchor="middle" font-size="12" fill="#4b5563">registrar, RFC 5626 flows</text>
    <rect x="400" y="252" width="200" height="72" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="500" y="276" text-anchor="middle" font-weight="600">MCPTT server · .20</text>
    <text x="500" y="295" text-anchor="middle" font-size="12" fill="#4b5563">authorisations, affiliations</text>
    <text x="500" y="313" text-anchor="middle" font-size="12" font-weight="600" fill="#c0392b">restarts (step 4)</text>
    <rect x="640" y="98" width="208" height="72" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="744" y="122" text-anchor="middle" font-weight="600">MCData server · .21</text>
    <text x="744" y="141" text-anchor="middle" font-size="12" fill="#4b5563">authorises the clients too;</text>
    <text x="744" y="159" text-anchor="middle" font-size="12" fill="#4b5563">does not restart</text>
    <rect x="640" y="188" width="208" height="120" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="744" y="212" text-anchor="middle" font-weight="600">Common services</text>
    <text x="744" y="232" text-anchor="middle" font-size="12" fill="#4b5563">IdMS · GMS · CMS · KMS · LMS</text>
    <text x="744" y="250" text-anchor="middle" font-size="12" fill="#4b5563">HTTP proxy · user database</text>
    <text x="744" y="268" text-anchor="middle" font-size="12" fill="#4b5563">content · message store</text>
    <text x="744" y="294" text-anchor="middle" font-size="12" fill="#4b5563">HTTPS</text>
  </g>

  <!-- SIP: clients to SIP core, SIP core to the servers -->
  <g stroke="#5b6472" stroke-width="1.6" fill="none">
    <path d="M242,92 C310,92 330,118 398,118" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M242,244 C320,244 330,140 398,140" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M242,310 C340,310 330,150 398,150" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M500,172 L500,250" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <path d="M602,134 L638,134" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  </g>
  <rect x="508" y="200" width="40" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
  <text x="528" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">SIP</text>

  <!-- bob's outbound flow: one TCP connection, opened by the client, used both ways -->
  <path d="M242,168 C310,168 330,128 398,128" stroke="#15803d" stroke-width="3" fill="none" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <rect x="252" y="196" width="118" height="38" rx="10" fill="#ffffff" stroke="#15803d"/>
  <text x="311" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">one TCP flow</text>
  <text x="311" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">both directions</text>
</svg>
