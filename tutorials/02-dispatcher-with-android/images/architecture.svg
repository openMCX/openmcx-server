<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Tutorial 2: the phones and a dispatcher position reach tutorial 1's openMCX system over the Wi-Fi</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>
  <rect width="900" height="400" rx="14" fill="#ffffff"/>

  <!-- devices -->
  <g font-size="14" fill="#1f2937">
    <rect x="30" y="30" width="190" height="64" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="125" y="58" text-anchor="middle" font-weight="600">Phone A</text>
    <text x="125" y="79" text-anchor="middle" font-size="12" fill="#4b5563">Alice · openMCX app</text>

    <rect x="30" y="112" width="190" height="64" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="125" y="140" text-anchor="middle" font-weight="600">Phone B</text>
    <text x="125" y="161" text-anchor="middle" font-size="12" fill="#4b5563">Bob · openMCX app</text>

    <rect x="30" y="200" width="190" height="170" rx="12" fill="#eef7ee" stroke="#2f8a3b" stroke-width="1.5"/>
    <text x="125" y="226" text-anchor="middle" font-weight="600">Dispatcher's computer</text>
    <rect x="45" y="256" width="160" height="40" rx="8" fill="#ffffff" stroke="#7cbf86"/>
    <text x="125" y="281" text-anchor="middle" font-size="12">browser · localhost:8080</text>
    <rect x="45" y="312" width="160" height="44" rx="8" fill="#ffffff" stroke="#7cbf86"/>
    <text x="125" y="331" text-anchor="middle" font-size="12" font-weight="600">Dispatcher Client</text>
    <text x="125" y="347" text-anchor="middle" font-size="11" fill="#4b5563">openMCX engine</text>
  </g>
  <path d="M125,296 L125,310" stroke="#2f8a3b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Wi-Fi -->
  <g stroke="#5b6472" stroke-width="1.6" fill="none">
    <path d="M220,62 C270,62 270,200 320,200" marker-end="url(#arrow)"/>
    <path d="M220,144 C270,144 270,200 320,200" marker-end="url(#arrow)"/>
    <path d="M205,334 C275,334 270,200 320,200" marker-end="url(#arrow)"/>
  </g>
  <rect x="243" y="14" width="58" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
  <text x="272" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Wi-Fi</text>

  <!-- computer -->
  <rect x="325" y="20" width="550" height="360" rx="16" fill="#fff7ed" stroke="#ea8a1a" stroke-width="2"/>
  <text x="345" y="50" font-size="16" font-weight="700" fill="#9a4b05">Computer · HOST_IP</text>
  <text x="855" y="50" text-anchor="end" font-size="12" fill="#9a4b05">tutorial 1's openMCX system</text>

  <g font-size="13" fill="#1f2937">
    <rect x="345" y="70" width="510" height="48" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="365" y="99" font-weight="600">MCX Admin</text>
    <text x="455" y="99" fill="#4b5563" font-size="12">users (Alice, Bob, Dispatcher), groups, templates, activation links</text>

    <rect x="345" y="130" width="160" height="64" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="425" y="158" text-anchor="middle" font-weight="600">MCPTT server</text>
    <text x="425" y="178" text-anchor="middle" font-size="12" fill="#4b5563">voice, floor control</text>
    <rect x="520" y="130" width="160" height="64" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="600" y="158" text-anchor="middle" font-weight="600">MCData server</text>
    <text x="600" y="178" text-anchor="middle" font-size="12" fill="#4b5563">messages, files</text>
    <rect x="695" y="130" width="160" height="64" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="775" y="158" text-anchor="middle" font-weight="600">MCVideo server</text>
    <text x="775" y="178" text-anchor="middle" font-size="12" fill="#4b5563">video, transmission</text>

    <rect x="345" y="206" width="510" height="72" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="365" y="233" font-weight="600">Common services</text>
    <text x="365" y="252" fill="#4b5563" font-size="12">IdMS · GMS · CMS · KMS · LMS</text>
    <text x="365" y="269" fill="#4b5563" font-size="12">Credential Service · content server · message store · notification server</text>

    <rect x="345" y="290" width="510" height="72" rx="10" fill="#ffffff" stroke="#f0b46b"/>
    <text x="365" y="331" font-weight="600">SIP core</text>
    <text x="455" y="331" fill="#4b5563">Kamailio + MySQL · registration, routing</text>
  </g>
</svg>
