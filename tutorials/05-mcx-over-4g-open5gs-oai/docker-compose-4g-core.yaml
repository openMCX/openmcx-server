    - --tls-cert
    - /config/tls/kms.crt
    - --tls-key
    - /config/tls/kms.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    init: true
