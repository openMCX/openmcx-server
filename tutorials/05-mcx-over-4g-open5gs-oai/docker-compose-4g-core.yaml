    - --tls-key
    - /config/tls/gms.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    init: true
    tmpfs:
    - /run/mcx
    volumes:
    - ./config/tls/ca.crt:/config/tls/ca.crt:ro
    - ./config/site.json:/config/site.json:ro
    - ./config/tls/gms.crt:/config/tls/gms.crt:ro
    - ./config/tls/gms.key:/config/tls/gms.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - gms:/data
    healthcheck:
