      - /config/tls/ca.crt
      - https://gms:8443/readyz
      timeout: 3s
      interval: 3s
      retries: 30
      start_period: 10s
  cms:
    container_name: openmcx-cms
    image: ${OPENMCX_IMAGE_PREFIX-openmcx/}openmcx-common:${OPENMCX_TAG:-v1}
    entrypoint:
    - /usr/local/bin/mcx-common
