    - ./config/site.json:/config/site.json:ro
    - ./config/tls/cms.crt:/config/tls/cms.crt:ro
    - ./config/tls/cms.key:/config/tls/cms.key:ro
    - ./config/oidc-public.pem:/config/oidc-public.pem:ro
    - cms:/data
    healthcheck:
      test:
