    - --role
    - cms
    - --config
    - /config/site.json
    - --tls-cert
    - /config/tls/cms.crt
    - --tls-key
    - /config/tls/cms.key
    - --verification-key
    - /config/oidc-public.pem
    - --data-dir
    - /data
    - --ca-file
    - /config/tls/ca.crt
    init: true
    tmpfs:
