# OpenMCX: Agent Tutorial 1, the example bots of mcx-agent (tutorials/agents/01-example-bots/README.md).
#
# An agent user for the system of End-to-End Tutorial 1: mcx-agent, activated from MCX Admin like a phone, and the
# three example bots of openmcx-client beside it. The agent reaches the system as the phones do, through HOST_IP and
# the ports tutorial 1 publishes; the phones message and call it. Tutorial 1's system must be running.
#
#   cp .env.example .env                                   then set HOST_IP (and AGENT_IP) in .env
#   docker compose run --rm activate '<activation link>'   once: activates the agent as the user bots
#   docker compose up -d
#
# Ports used on the agent's computer: 5081/tcp (SIP), 4800 and 5800/udp (MCPTT speech and floor control), 4900, 5900
# and 6900/udp (MCVideo), 8765/tcp on 127.0.0.1 only (MCP over HTTP for the bots); none of them is one tutorial 1 or
# the dispatcher of tutorial 2 uses, so all three run on one computer.

name: openmcx-agent

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-agent-image: &agent-image ${OPENMCX_AGENT_IMAGE:-openmcx-agent:local}

services:
  # Once: the agent's MC client activates from MCX Admin's link, with the password of bots typed in.
  activate:
    logging: *logging
    image: *agent-image
    profiles: [activate]
    network_mode: host
    extra_hosts:
      - "sip-core:${HOST_IP:?set HOST_IP in .env}"
    environment:
      HOST_IP: ${HOST_IP:?set HOST_IP in .env}
      AGENT_IP: ${AGENT_IP:-${HOST_IP}}
    entrypoint: [sh, /tutorials/activate.sh]
    volumes:
      - ./setup/device.json.in:/tutorials/device.json.in:ro
      - ./setup/activate.sh:/tutorials/activate.sh:ro
      - agent-data:/data

  # The agent: mcx-agent with mcx-client as its engine, on the network of its computer, as a phone is on the Wi-Fi.
  agent:
    logging: *logging
    container_name: openmcx-agent
    image: *agent-image
    network_mode: host
    # The SIP core's name, as the activation package names it, at the system's address (its certificate names
    # sip-core); the other services are reached through the package's address map.
    extra_hosts:
      - "sip-core:${HOST_IP:?set HOST_IP in .env}"
    environment:
      MCX_AGENT_SOCKET: /run/mcx/agent.sock
      MCX_LOG: ${MCX_LOG:-info}
    init: true
    entrypoint: [/usr/local/bin/mcx-agent]
    command: [daemon, --config, /tutorials/agent.json]
    volumes:
      - ./setup/agent.json:/tutorials/agent.json:ro
      - agent-data:/data
    tmpfs:
      - /run/mcx
    healthcheck:
      test: [CMD, mcx-agent, status]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # The bots: each reaches only the agent's MCP server on 127.0.0.1:8765, with the token.
  chat-bot:
    logging: *logging
    image: *agent-image
    network_mode: host
    entrypoint: [python3, -u, /usr/local/share/mcx-agent/examples/chat-bot.py]
    command: [--url, "http://127.0.0.1:8765/mcp", --token-file, /data/token, --cursor, /data/chat.cursor]
    volumes:
      - agent-data:/data
    depends_on: [agent]
    restart: unless-stopped

  voice-bot:
    logging: *logging
    image: *agent-image
    network_mode: host
    entrypoint: [python3, -u, /usr/local/share/mcx-agent/examples/voice-bot.py]
    command: [--mcp-url, "http://127.0.0.1:8765/mcp", --token-file, /data/token]
    volumes:
      - agent-data:/data:ro
    depends_on: [agent]
    restart: unless-stopped

  video-bot:
    logging: *logging
    image: *agent-image
    network_mode: host
    entrypoint: [python3, -u, /usr/local/share/mcx-agent/examples/video-bot.py]
    command: [--mcp-url, "http://127.0.0.1:8765/mcp", --token-file, /data/token]
    volumes:
      - agent-data:/data:ro
    depends_on: [agent]
    restart: unless-stopped

volumes:
  agent-data:
