<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Agent Tutorial 1: the phones of Alice and Bob reach tutorial 1's OpenMCX system over the Wi-Fi; on the computer, the agent bots (mcx-agent and its MC client) reaches the system the same way, and the chat, voice and video bots reach the agent over MCP on 127.0.0.1:8765</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f8f5b"/>
    </marker>
  </defs>
  <rect width="900" height="420" rx="14" fill="#ffffff"/>

  <!-- the computer -->
  <rect x="12" y="12" width="640" height="396" rx="16" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="32" y="40" font-size="15" font-weight="700" fill="#374151">Tutorial 1's computer · HOST_IP</text>

  <!-- bots -->
  <g font-size="14" fill="#1f2937">
    <rect x="32" y="70" width="180" height="56" rx="12" fill="#ecfdf3" stroke="#2f8f5b" stroke-width="1.5"/>
    <text x="122" y="94" text-anchor="middle" font-weight="600">chat-bot</text>
    <text x="122" y="113" text-anchor="middle" font-size="12" fill="#4b5563">MCData: time, ping, help</text>
    <rect x="32" y="140" width="180" height="56" rx="12" fill="#ecfdf3" stroke="#2f8f5b" stroke-width="1.5"/>
    <text x="122" y="164" text-anchor="middle" font-weight="600">voice-bot</text>
    <text x="122" y="183" text-anchor="middle" font-size="12" fill="#4b5563">MCPTT: says it back</text>
    <rect x="32" y="210" width="180" height="56" rx="12" fill="#ecfdf3" stroke="#2f8f5b" stroke-width="1.5"/>
    <text x="122" y="234" text-anchor="middle" font-weight="600">video-bot</text>
    <text x="122" y="253" text-anchor="middle" font-size="12" fill="#4b5563">MCVideo: a test card</text>
  </g>

  <!-- agent -->
  <rect x="262" y="128" width="150" height="82" rx="12" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2"/>
  <text x="337" y="154" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">agent · bots</text>
  <text x="337" y="173" text-anchor="middle" font-size="12" fill="#4b5563">mcx-agent</text>
  <text x="337" y="191" text-anchor="middle" font-size="12" fill="#4b5563">+ mcx-client</text>
  <path d="M212 98 L262 150" stroke="#2f8f5b" stroke-width="1.6" fill="none" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <path d="M212 168 L262 169" stroke="#2f8f5b" stroke-width="1.6" fill="none" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <path d="M212 238 L262 188" stroke="#2f8f5b" stroke-width="1.6" fill="none" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)"/>
  <text x="122" y="296" text-anchor="middle" font-size="12" fill="#1f6b43">MCP over HTTP, token</text>
  <text x="122" y="313" text-anchor="middle" font-size="12" fill="#1f6b43">127.0.0.1:8765</text>

  <!-- OpenMCX system -->
  <rect x="462" y="56" width="170" height="300" rx="16" fill="#fff7ed" stroke="#ea8a1a" stroke-width="2"/>
  <text x="547" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#9a4b05">OpenMCX system</text>
  <text x="547" y="99" text-anchor="middle" font-size="11" fill="#9a4b05">tutorial 1</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <rect x="477" y="110" width="140" height="34" rx="8" fill="#ffffff" stroke="#f0b46b"/>
    <text x="547" y="132">SIP core</text>
    <rect x="477" y="152" width="140" height="34" rx="8" fill="#ffffff" stroke="#f0b46b"/>
    <text x="547" y="174">MCPTT server</text>
    <rect x="477" y="194" width="140" height="34" rx="8" fill="#ffffff" stroke="#f0b46b"/>
    <text x="547" y="216">MCData server</text>
    <rect x="477" y="236" width="140" height="34" rx="8" fill="#ffffff" stroke="#f0b46b"/>
    <text x="547" y="258">MCVideo server</text>
    <rect x="477" y="278" width="140" height="34" rx="8" fill="#ffffff" stroke="#f0b46b"/>
    <text x="547" y="300">MCX Admin, IdMS, ...</text>
  </g>
  <path d="M412 169 L462 169" stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="437" y="160" text-anchor="middle" font-size="11" fill="#4b5563">HOST_IP</text>
  <text x="332" y="384" text-anchor="middle" font-size="12" fill="#4b5563">the agent activates from MCX Admin and registers like a phone</text>

  <!-- Wi-Fi and phones -->
  <text x="776" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">Wi-Fi</text>
  <g font-size="14" fill="#1f2937">
    <rect x="696" y="100" width="160" height="96" rx="18" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="776" y="134" text-anchor="middle" font-weight="600">Phone A</text>
    <text x="776" y="154" text-anchor="middle" font-size="12" fill="#4b5563">alice</text>
    <text x="776" y="172" text-anchor="middle" font-size="12" fill="#4b5563">OpenMCX app</text>
    <rect x="696" y="222" width="160" height="96" rx="18" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="1.5"/>
    <text x="776" y="256" text-anchor="middle" font-weight="600">Phone B</text>
    <text x="776" y="276" text-anchor="middle" font-size="12" fill="#4b5563">bob</text>
    <text x="776" y="294" text-anchor="middle" font-size="12" fill="#4b5563">OpenMCX app</text>
  </g>
  <path d="M696 148 L632 180" stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M696 270 L632 240" stroke="#5b6472" stroke-width="1.6" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="776" y="350" text-anchor="middle" font-size="12" fill="#4b5563">message, call and video call</text>
  <text x="776" y="366" text-anchor="middle" font-size="12" fill="#4b5563">the user bots</text>
</svg>
