# srsUE for tutorial 4: 5G SA over the ZeroMQ virtual radio to the srsRAN gNB (srsran/gnb.yaml).
# The subscriber is tutorial 3's (oai/oai_db.sql): IMSI 208990100001100, one PDU session on DNN "mcptt".
[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://192.168.71.150:2001,rx_port=tcp://192.168.71.140:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none

[log]
all_level = warning
filename = stdout

[usim]
mode = soft
algo = milenage
opc  = C42449363BBAD02B66D16BC975D77CC1
k    = fec86ba6eb707ed08905757b1bb44b8f
imsi = 208990100001100
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = mcptt
apn_protocol = ipv4

[slicing]
enable = true
nssai-sst = 1
nssai-sd = 16777215    # 0xFFFFFF, no SD: the core's slice (srsUE's default SD is 1, which the AMF rejects)

[gw]
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
