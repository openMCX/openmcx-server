{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openmcx.serviceAccountName" . }}
  labels:
    {{- include "openmcx.labels" . | nindent 4 }}
  {{- include "openmcx.annotations" .Values.serviceAccount.annotations | nindent 2 }}
automountServiceAccountToken: false
{{- end }}
